function safeId(value,prefix="id"){const clean=String(value||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,70);return clean||uid(prefix)}
function uid(prefix="id"){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`}
function dateFromKey(key){const [y,m,d]=String(key).split("-").map(Number);return new Date(y,m-1,d,12)}
function addDays(key,days){const d=dateFromKey(key);d.setDate(d.getDate()+days);return localDateKey(d)}
function daysBetween(a,b){return Math.floor((dateFromKey(b)-dateFromKey(a))/86400000)}
function mondayOf(key=localDateKey()){const d=dateFromKey(key),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return localDateKey(d)}
function lastDays(count=7){const today=localDateKey();return Array.from({length:count},(_,i)=>{const key=addDays(today,i-count+1);return{key,date:dateFromKey(key)}})}

function goalCategory(){return state.profile.goal==="healthGoal"?"health":state.profile.goal==="orderGoal"?"order":state.profile.goal==="focusGoal"?"mind":"social"}
function weekDates(){const start=addDays(mondayOf(),weekOffset*7);return Array.from({length:7},(_,i)=>addDays(start,i))}
function habitDue(habit,date){return habit.activeDays.includes(dayIndexMonday(date))}
function habitValue(habit,date){return Math.max(0,Number(habit.values?.[date])||0)}
function habitCompletedOn(habit,date){return habit.mode==="value"?habitValue(habit,date)>=Math.max(.1,Number(habit.target)||1):habit.completedDates.includes(date)}
function habitTotal(habit){return habit.mode==="value"?Object.values(habit.values||{}).filter(v=>Number(v)>=Math.max(.1,Number(habit.target)||1)).length:habit.completedDates.length}
function habitStreak(habit){let cursor=localDateKey(),streak=0,guard=0;if(!habitDue(habit,cursor)||!habitCompletedOn(habit,cursor))cursor=addDays(cursor,-1);while(guard++<420){if(!habitDue(habit,cursor)){cursor=addDays(cursor,-1);continue}if(habitCompletedOn(habit,cursor)){streak++;cursor=addDays(cursor,-1);continue}break}return streak}

function saveHabitValue(id,date){const habit=state.habits.find(x=>x.id===id);if(!habit)return;const input=document.getElementById("habitValueDialogInput"),value=Math.max(0,Number(input?.value)||0),wasDone=habitCompletedOn(habit,date),key=rewardKey("habit",habit.id,date),reward={xp:8,coins:3,energy:5,category:habit.category};habit.values=habit.values||{};if(value>0)habit.values[date]=Math.round(value*100)/100;else delete habit.values[date];const nowDone=habitCompletedOn(habit,date);if(nowDone&&!habit.completedDates.includes(date))habit.completedDates.push(date);if(!nowDone)habit.completedDates=habit.completedDates.filter(d=>d!==date);if(!wasDone&&nowDone){applyReward(key,reward,{activity:`${habit.title} · ${value} ${habit.unit}`});showToast(t("completedReward",reward),"good");celebrate(12)}else if(wasDone&&!nowDone){revokeReward(key,{fallbackCompletion:true,date});showToast(t("undoDone"))}else showToast(gx("Değer güncellendi.","Value updated."),"good");closeDialog(true);checkAchievements();scheduleSave();renderAll()}

function cycleChallengeDay(id,day){const c=state.challenges.find(x=>x.id===id),date=c?challengeDayDate(c,day):"";if(!c||date>localDateKey()){showToast(t("futureDisabled"));return}showDialog(`<h2>${t("challengeChoose")}</h2><p>${esc(c.title)} · ${day}. ${t("day")}</p><div class="stack"><button class="primary" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="done">✓ ${t("done")}</button><button class="secondary" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="partial">◐ ${t("partial")}</button><button class="danger" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="missed">× ${t("missed")}</button><button class="ghost" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="clear">${t("clearStatus")}</button></div>`)}

/* ===== Habitopia v1.1 Growth System ===== */
let growthCalendarDate=new Date(),growthCalendarSelected=localDateKey(),routineTab="morning";
function gx(tr,en){return state.settings.lang==="en"?en:tr}
function ensurePlanner(){

    {id:"water",tr:"Bir bardak su iç",en:"Drink a glass of water"},{id:"plan",tr:"Bugünün 3 önceliğini belirle",en:"Choose today's 3 priorities"},{id:"move",tr:"5 dakika hareket et",en:"Move for 5 minutes"},{id:"focus",tr:"Günün odağını belirle",en:"Choose today's focus"}
  ]:[
    {id:"review",tr:"Bugünün kısa değerlendirmesini yap",en:"Review your day"},{id:"tomorrow",tr:"Yarının önceliklerini düşün",en:"Think about tomorrow's priorities"},{id:"mood",tr:"Ruh halini kaydet",en:"Log your mood"},{id:"offline",tr:"Günü sakin bir şekilde kapat",en:"Close the day calmly"}

}

function toggleRoutine(type,id){const r=routineRecord()[type],i=r.indexOf(id);if(i>=0)r.splice(i,1);else r.push(id);scheduleSave();renderRoutines();renderToday();checkAchievements()}
function renderRoutines(){const host=document.getElementById("routineContent");if(!host)return;const rec=routineRecord(),defs=routineDefinitions(routineTab),p=routineProgress(routineTab);host.innerHTML=`<div class="routine-tabs"><button class="${routineTab==="morning"?"active":""}" data-action="routine-tab" data-id="morning">🌅 ${gx("Sabah","Morning")}</button><button class="${routineTab==="evening"?"active":""}" data-action="routine-tab" data-id="evening">🌙 ${gx("Akşam","Evening")}</button></div><div class="routine-summary"><strong>${p.done}/${p.total} · %${Math.round(p.done/p.total*100)}</strong><span>${gx("Bugünkü rutin ilerlemen","Today's routine progress")}</span></div><div class="routine-list">${defs.map(x=>{const done=rec[routineTab].includes(x.id);return `<div class="routine-item ${done?"done":""}"><button class="routine-check" data-action="routine-toggle" data-id="${x.id}" data-type="${routineTab}">✓</button><strong>${gx(x.tr,x.en)}</strong></div>`}).join("")}</div>`}

function focusMinutesOn(date){return state.tracking.focusSessions.filter(x=>x.date===date).reduce((n,x)=>n+Number(x.minutes||0),0)}
function taskDayStats(date){const all=state.tasks.filter(x=>localDateKey(new Date(x.createdAt||0))<=date);return{done:all.filter(x=>x.completedDates.includes(date)).length,total:all.length}}
function habitDayStats(date){let total=0,done=0;state.habits.forEach(h=>{if(habitDue(h,date)){total++;if(h.completedDates.includes(date))done++}});return{done,total}}
function dailyPlanData(date=localDateKey()){
  const tsk=taskDayStats(date),hab=habitDayStats(date),water=state.water.records[date]||{count:0,goal:state.water.defaultGoal},focus=focusMinutesOn(date),target=Math.max(10,Number(state.profile.dailyMinutes)||15),mor=routineProgress("morning",date),eve=routineProgress("evening",date);
  const items=[
    {id:"tasks",done:tsk.total?tsk.done>=tsk.total:false,title:gx("Görevlerini tamamla","Complete your tasks"),copy:tsk.total?`${tsk.done}/${tsk.total}`:gx("Bugün görev ekleyebilirsin","Add a task for today"),action:"open-task"},
    {id:"habits",done:hab.total?hab.done>=hab.total:false,title:gx("Alışkanlık ritmini koru","Keep your habit rhythm"),copy:hab.total?`${hab.done}/${hab.total}`:gx("Bir alışkanlık oluştur","Create a habit"),action:"add-habit"},
    {id:"water",done:water.count>=water.goal,title:gx("Su hedefini tamamla","Complete your water goal"),copy:`${water.count}/${water.goal}`,action:"water-stats"},
    {id:"focus",done:focus>=target,title:gx(`${target} dakika odaklan`, `Focus for ${target} minutes`),copy:`${focus}/${target} ${gx("dk","min")}`,action:"open-focus"},
    {id:"routine",done:(mor.done+eve.done)>=Math.ceil((mor.total+eve.total)/2),title:gx("Günün rutinini tamamla","Complete your daily routine"),copy:`${mor.done+eve.done}/${mor.total+eve.total}`,action:"routines"}
  ]; return items;
}
function growthScore(date=localDateKey()){
  const plan=dailyPlanData(date),planPct=Math.round(plan.filter(x=>x.done).length/plan.length*100),hab=habitDayStats(date),habitPct=hab.total?Math.round(hab.done/hab.total*100):50,w=state.water.records[date],waterPct=w?Math.min(100,Math.round(w.count/w.goal*100)):0,target=Math.max(10,Number(state.profile.dailyMinutes)||15),focusPct=Math.min(100,Math.round(focusMinutesOn(date)/target*100)),mood=(state.tracking.moods||{})[date],moodPct=mood?mood*20:50;
  const score=Math.round(planPct*.30+habitPct*.25+waterPct*.20+focusPct*.20+moodPct*.05);return{score,planPct,habitPct,waterPct,focusPct,moodPct};
}
function weekAverageScore(start=mondayOf()){let sum=0,count=0;for(let i=0;i<7;i++){const d=addDays(start,i);if(d>localDateKey())continue;sum+=growthScore(d).score;count++}return count?Math.round(sum/count):0}
function renderGrowthDashboard(){const host=document.getElementById("growthDashboard");if(!host)return;ensurePlanner();const g=growthScore(),prev=weekAverageScore(addDays(mondayOf(),-7)),curr=weekAverageScore(mondayOf()),trend=curr-prev,plan=dailyPlanData(),done=plan.filter(x=>x.done).length,pct=Math.round(done/plan.length*100),mor=routineProgress("morning"),eve=routineProgress("evening");host.innerHTML=`<div class="growth-score-card"><div class="growth-score-ring" style="--pct:${g.score}%"><b>${g.score}</b></div><div class="growth-score-copy"><strong>${gx("Gelişim Skorun","Your Growth Score")}</strong><span>${gx("Bugünkü düzen, odak ve alışkanlık dengesi","Today's balance of habits and focus")}</span></div><div class="growth-score-trend">${trend>=0?"↑":"↓"} ${Math.abs(trend)}</div></div><div class="daily-plan"><div class="daily-plan-head"><div><strong>🔥 ${gx("Bugünkü Akıllı Planın","Today's Smart Plan")}</strong><span>${done}/${plan.length} · %${pct}</span></div><button class="small-btn" data-action="calendar">${gx("Takvim","Calendar")}</button></div><div class="plan-progress"><i style="width:${pct}%"></i></div>${plan.map(x=>`<div class="plan-item ${x.done?"done":""}"><div class="plan-status">${x.done?"✓":"•"}</div><div class="plan-item-main"><strong>${x.title}</strong><span>${x.copy}</span></div><button class="small-btn" data-action="${x.action}">${x.done?gx("Tamam","Done"):gx("Aç","Open")}</button></div>`).join("")}</div><div class="growth-actions"><button class="growth-action" data-action="routines"><b>🌅</b><strong>${gx("Rutinler","Routines")}</strong><span>${mor.done+eve.done}/${mor.total+eve.total} ${gx("adım","steps")}</span></button><button class="growth-action" data-action="journal"><b>📖</b><strong>${gx("Günlük","Journal")}</strong><span>${gx("Bugünü değerlendir","Reflect on today")}</span></button><button class="growth-action" data-action="weekly-goals"><b>🎯</b><strong>${gx("Haftalık Hedefler","Weekly Goals")}</strong><span>${weeklyGoalsData().filter(x=>x.pct>=100).length}/${weeklyGoalsData().length}</span></button><button class="growth-action" data-action="weekly-review"><b>🧠</b><strong>${gx("Haftalık Değerlendirme","Weekly Review")}</strong><span>${gx("Haftandan öğren","Learn from your week")}</span></button></div>`}

function calendarHasActivity(date){const t=taskDayStats(date),h=habitDayStats(date),w=state.water.records[date],f=focusMinutesOn(date),j=(state.planner?.journal||[]).some(x=>x.date===date),r=state.planner?.routineDates?.[date];return t.done||h.done||(w&&w.count)||f||j||(r&&(r.morning?.length||r.evening?.length))}

function saveJournal(){ensurePlanner();const data={date:localDateKey(),good:document.getElementById("journalGood").value.trim(),hard:document.getElementById("journalHard").value.trim(),tomorrow:document.getElementById("journalTomorrow").value.trim(),free:document.getElementById("journalFree").value.trim(),updatedAt:new Date().toISOString()};if(!data.good&&!data.hard&&!data.tomorrow&&!data.free){showToast(gx("Kaydetmek için bir şey yaz.","Write something before saving."),"bad");return}const i=state.planner.journal.findIndex(x=>x.date===data.date);if(i>=0)state.planner.journal[i]=data;else state.planner.journal.push(data);scheduleSave();renderJournal();renderToday();checkAchievements();showToast(gx("Günlük kaydedildi.","Journal saved."),"good")}

function weekRange(start=mondayOf()){return Array.from({length:7},(_,i)=>addDays(start,i))}

function renderWeeklyGoals(){const host=document.getElementById("weeklyGoalsContent");if(!host)return;const goals=weeklyGoalsData(),done=goals.filter(x=>x.pct>=100).length,avg=Math.round(goals.reduce((n,x)=>n+x.pct,0)/goals.length);host.innerHTML=`<div class="challenge-summary"><div><strong>${done}/${goals.length} ${gx("hedef tamamlandı","goals complete")}</strong><p>${gx("Bu haftanın genel ilerlemesi","Overall progress this week")} · %${avg}</p></div><div class="challenge-ring" style="--pct:${avg}%"><b>%${avg}</b></div></div><div class="weekly-goals">${goals.map(g=>`<div class="weekly-goal ${g.pct>=100?"done":""}"><div class="weekly-goal-top"><strong>${g.pct>=100?"✓ ":""}${g.title}</strong><span>${g.value}/${g.target} ${g.unit}</span></div><div class="goal-progress"><i style="width:${g.pct}%"></i></div></div>`).join("")}</div><p class="card-sub" style="margin:12px 2px 0">${gx("Hedefler günlük ayırdığın süreye ve mevcut alışkanlıklarına göre otomatik oluşur.","Goals adapt automatically to your daily time and current habits.")}</p>`}

function weeklyReviewKey(start=mondayOf()){return start}
function renderWeeklyReview(){ensurePlanner();const host=document.getElementById("weeklyReviewContent");if(!host)return;const key=weeklyReviewKey(),r=state.planner.weeklyReviews[key]||{proud:"",hard:"",focus:""},score=weekAverageScore(),last=weekAverageScore(addDays(mondayOf(),-7)),delta=score-last,goals=weeklyGoalsData(),done=goals.filter(x=>x.pct>=100).length;host.innerHTML=`<div class="review-card"><span class="card-sub">${gx("BU HAFTA","THIS WEEK")}</span><div class="review-score">${score}</div><strong>${delta>=0?"↑":"↓"} ${Math.abs(delta)} ${gx("puan","points")}</strong><p>${done}/${goals.length} ${gx("haftalık hedef tamamlandı. Bu değerlendirme bir sonraki haftanın odağını daha bilinçli seçmene yardım eder.","weekly goals completed. This review helps you choose next week's focus deliberately.")}</p></div><div class="review-fields"><div class="journal-prompt"><label>${gx("Bu hafta en çok neyle gurur duyuyorsun?","What are you most proud of this week?")}</label><textarea id="reviewProud">${esc(r.proud)}</textarea></div><div class="journal-prompt"><label>${gx("Seni en çok ne zorladı?","What challenged you most?")}</label><textarea id="reviewHard">${esc(r.hard)}</textarea></div><div class="journal-prompt"><label>${gx("Gelecek hafta neye odaklanmak istiyorsun?","What do you want to focus on next week?")}</label><textarea id="reviewFocus">${esc(r.focus)}</textarea></div><button class="primary" data-action="save-weekly-review">${gx("Haftayı Kaydet","Save Weekly Review")}</button></div>`}
function saveWeeklyReview(){ensurePlanner();const key=weeklyReviewKey(),data={proud:document.getElementById("reviewProud").value.trim(),hard:document.getElementById("reviewHard").value.trim(),focus:document.getElementById("reviewFocus").value.trim(),updatedAt:new Date().toISOString()};if(!data.proud&&!data.hard&&!data.focus){showToast(gx("Değerlendirmeye birkaç cümle ekle.","Add a few thoughts to your review."),"bad");return}state.planner.weeklyReviews[key]=data;scheduleSave();showToast(gx("Haftalık değerlendirme kaydedildi.","Weekly review saved."),"good");renderWeeklyReview()}
function openWeeklyReview(){renderWeeklyReview();openSheet("weeklyReviewSheet")}
function openGrowthDetails(){const g=growthScore(),labels=[[gx("Akıllı Plan","Smart Plan"),g.planPct],[gx("Alışkanlıklar","Habits"),g.habitPct],[gx("Su","Water"),g.waterPct],[gx("Odak","Focus"),g.focusPct],[gx("Ruh Hali","Mood"),g.moodPct]];showDialog(`<h2>${gx("Gelişim Skoru","Growth Score")} · ${g.score}/100</h2><p>${gx("Skor; plan, alışkanlık, su, odak ve ruh hali verilerinin dengeli birleşimidir. Bir sağlık puanı değildir; yalnızca uygulamadaki günlük ritmini özetler.","The score combines plan, habits, water, focus and mood. It is not a health score; it only summarizes your rhythm inside the app.")}</p><div class="report-bars">${labels.map(([a,b])=>`<div><div class="report-bar-head"><span>${a}</span><b>%${b}</b></div><div class="report-track"><i style="width:${b}%"></i></div></div>`).join("")}</div><div class="dialog-actions one" style="margin-top:14px"><button class="primary" data-action="close-dialog">${t("close")}</button></div>`)}

const _renderTodayGrowth=renderToday;renderToday=function(){_renderTodayGrowth();renderGrowthDashboard()};
const _renderProfileGrowth=renderProfile;renderProfile=function(){_renderProfileGrowth();const en=state.settings.lang==="en";const title=document.getElementById("growthHubTitle"),sub=document.getElementById("growthHubSub");if(title)title.textContent=en?"Growth Center":"Gelişim Merkezi";if(sub)sub.textContent=en?"Plan · act · reflect":"Planla · uygula · değerlendir";document.querySelectorAll("#growthHubActions .growth-action").forEach((b,i)=>{const strong=b.querySelector("strong"),span=b.querySelector("span"),names=en?[["Calendar","See your daily progress"],["Routines","Morning and evening"],["Journal","Reflect on your day"],["Weekly Goals","Track this week's focus"],["Weekly Review","Learn from your week"],["Growth Score","See score details"]]:[["Takvim","Günlük gelişimini gör"],["Rutinler","Sabah ve akşam"],["Günlük","Gününü düşün ve yaz"],["Haftalık Hedefler","Haftanın odağını takip et"],["Haftayı Değerlendir","Öğren ve yeni haftayı kur"],["Gelişim Skoru","Skorunun detaylarını gör"]];if(strong)strong.textContent=names[i][0];if(span)span.textContent=names[i][1]})};
const _handleActionGrowth=handleAction;handleAction=function(action,el){switch(action){case"calendar":openCalendar();return;case"calendar-prev":growthCalendarDate=new Date(growthCalendarDate.getFullYear(),growthCalendarDate.getMonth()-1,1,12);renderCalendar();return;case"calendar-next":growthCalendarDate=new Date(growthCalendarDate.getFullYear(),growthCalendarDate.getMonth()+1,1,12);renderCalendar();return;case"calendar-day":growthCalendarSelected=el.dataset.date;renderCalendar();return;case"routines":openRoutines();return;case"routine-tab":routineTab=el.dataset.id;renderRoutines();return;case"routine-toggle":toggleRoutine(el.dataset.type,el.dataset.id);return;case"journal":openJournal();return;case"save-journal":saveJournal();return;case"weekly-goals":openWeeklyGoals();return;case"weekly-review":openWeeklyReview();return;case"save-weekly-review":saveWeeklyReview();return;case"growth-details":openGrowthDetails();return;case"mood-prev":moodMonthDate=new Date(moodMonthDate.getFullYear(),moodMonthDate.getMonth()-1,1,12);renderMood();return;case"mood-next":{const n=new Date(moodMonthDate.getFullYear(),moodMonthDate.getMonth()+1,1,12),now=new Date(new Date().getFullYear(),new Date().getMonth(),1,12);if(n<=now)moodMonthDate=n;renderMood();return}default:return _handleActionGrowth(action,el)}};

async function init(){state=defaultState();bindEvents();await loadState();ensurePlanner();applyTranslations();renderStatic();renderOnboarding();reconcileFocusTimer(true);renderAll();document.getElementById("onboarding").classList.toggle("hidden",!!state.onboardingDone)}
init();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
