const storageAdapter={async get(key){try{if(window.storage&&typeof window.storage.get==="function"){const result=await window.storage.get(key,false);if(result&&typeof result.value==="string")return result.value;if(typeof result==="string")return result}}catch(error){}try{return localStorage.getItem(key)}catch(error){return null}},async set(key,value){let bridge=false;try{if(window.storage&&typeof window.storage.set==="function"){await window.storage.set(key,value,false);bridge=true}}catch(error){}try{localStorage.setItem(key,value);return true}catch(error){if(!bridge)throw error;return true}},async remove(key){try{if(window.storage&&typeof window.storage.delete==="function")await window.storage.delete(key,false)}catch(error){}try{localStorage.removeItem(key)}catch(error){}}};
async function loadState(){let raw=await storageAdapter.get(STORAGE_KEY);if(raw){try{state=normalizeState(JSON.parse(raw))}catch(error){const backup=await storageAdapter.get(BACKUP_KEY);try{state=backup?normalizeState(JSON.parse(backup)):defaultState()}catch(e){state=defaultState()}}}else{let migrated=null;for(const key of LEGACY_KEYS){const legacy=await storageAdapter.get(key);if(!legacy)continue;try{migrated=migrateLegacy(JSON.parse(legacy),key);break}catch(error){}}state=normalizeState(migrated||defaultState())}currentWater();updateStreak();applySettings(false);await persistNow()}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persistNow,140)}
async function persistNow(){state.updatedAt=new Date().toISOString();pruneData();try{const current=await storageAdapter.get(STORAGE_KEY);if(current){try{JSON.parse(current);await storageAdapter.set(BACKUP_KEY,current)}catch(error){}}await storageAdapter.set(STORAGE_KEY,JSON.stringify(state));return true}catch(error){showToast(state.settings.lang==="en"?"Progress could not be saved.":"İlerleme kaydedilemedi.","bad");return false}}
function pruneData(){trimObject(state.progress.dayCounts);trimObject(state.water.records);state.progress.activeDates=state.progress.activeDates.slice(-420);state.tracking.focusSessions=state.tracking.focusSessions.slice(0,365);state.activity=state.activity.slice(0,80);state.tasks.forEach(x=>x.completedDates=x.completedDates.slice(-420));state.habits.forEach(x=>x.completedDates=x.completedDates.slice(-420))}

function levelInfo(){let xp=state.progress.xp,level=1,need=50;while(xp>=need){xp-=need;level++;need=50+(level-1)*25}return{level,current:xp,need,pct:clamp(xp/need*100,0,100)}}
function rewardForTask(task){if(task.type==="focus"){const minutes=clamp(Number(task.duration)||25,10,60);return{xp:Math.max(8,Math.round(minutes*.6)),coins:Math.max(3,Math.round(minutes*.2)),energy:Math.max(6,Math.round(minutes*.7)),category:task.category}}const e=EFFORTS[task.effort]||EFFORTS.normal;return{xp:e.xp,coins:e.coins,energy:e.energy,category:task.category}}
function rewardKey(type,id,date=localDateKey()){return `${type}:${safeId(id,type)}:${date}`}
function applyReward(key,reward,{countCompletion=true,activity=""}={}){if(state.rewardLedger[key])return false;const date=key.split(":").pop();const normalized={xp:Math.max(0,Number(reward.xp)||0),coins:Math.max(0,Number(reward.coins)||0),energy:Math.max(0,Number(reward.energy)||0),category:CATEGORIES[reward.category]?reward.category:"mind",countCompletion,date};state.rewardLedger[key]=normalized;state.progress.xp+=normalized.xp;state.progress.coins+=normalized.coins;state.progress.categoryEnergy[normalized.category]=(state.progress.categoryEnergy[normalized.category]||0)+normalized.energy;if(countCompletion){state.progress.totalCompleted++;state.progress.dayCounts[date]=(state.progress.dayCounts[date]||0)+1;if(!state.progress.activeDates.includes(date))state.progress.activeDates.push(date)}if(activity)state.activity.unshift({id:uid("log"),date,text:activity});updateStreak();playSuccess();return true}
function revokeReward(key,{fallbackCompletion=false,date=localDateKey()}={}){const r=state.rewardLedger[key];if(r){state.progress.xp=Math.max(0,state.progress.xp-r.xp);state.progress.coins=Math.max(0,state.progress.coins-r.coins);state.progress.categoryEnergy[r.category]=Math.max(0,(state.progress.categoryEnergy[r.category]||0)-r.energy);if(r.countCompletion){state.progress.totalCompleted=Math.max(0,state.progress.totalCompleted-1);state.progress.dayCounts[r.date]=Math.max(0,(state.progress.dayCounts[r.date]||0)-1);if(!state.progress.dayCounts[r.date])delete state.progress.dayCounts[r.date]}delete state.rewardLedger[key]}else if(fallbackCompletion){state.progress.totalCompleted=Math.max(0,state.progress.totalCompleted-1);state.progress.dayCounts[date]=Math.max(0,(state.progress.dayCounts[date]||0)-1);if(!state.progress.dayCounts[date])delete state.progress.dayCounts[date]}const active=new Set(Object.keys(state.progress.dayCounts).filter(d=>state.progress.dayCounts[d]>0));state.progress.activeDates=state.progress.activeDates.filter(d=>active.has(d));updateStreak();return !!r}
function updateStreak(){const dates=new Set(state.progress.activeDates);let cursor=localDateKey(),count=0;if(!dates.has(cursor))cursor=addDays(cursor,-1);while(dates.has(cursor)){count++;cursor=addDays(cursor,-1)}state.progress.currentStreak=count;state.progress.longestStreak=Math.max(Number(state.progress.longestStreak)||0,count)}

function changeWater(delta){const date=localDateKey(),r=currentWater(),wasComplete=r.count>=r.goal;r.count=clamp(r.count+delta,0,40);const isComplete=r.count>=r.goal,key=rewardKey("water","daily",date),reward={xp:8,coins:3,energy:5,category:"health"};if(!wasComplete&&isComplete){r.rewarded=true;applyReward(key,reward,{activity:t("waterComplete")});showToast(t("completedReward",reward),"good");celebrate()}else if(wasComplete&&!isComplete){r.rewarded=false;revokeReward(key,{fallbackCompletion:true,date});showToast(t("undoDone"))}checkAchievements();scheduleSave();renderAll()}
function updateWaterGoal(value){const newGoal=clamp(Number(value)||8,1,20),r=currentWater();if(r.count>0){showToast(t("waterGoalLocked"));renderSettings();return}r.goal=newGoal;state.water.defaultGoal=newGoal;scheduleSave();renderAll();showToast(t("waterGoalHistory"),"good")}
function claimGift(){const today=localDateKey();if(state.dailyGiftDates.includes(today)){closeDialog();showToast(t("alreadyGift"));return}const cycle=state.dailyGiftDates.length%7,coins=[5,7,8,10,12,15,25][cycle],xp=[4,5,6,8,9,10,18][cycle];state.dailyGiftDates.push(today);state.progress.coins+=coins;state.progress.xp+=xp;state.progress.categoryEnergy[goalCategory()]+=3;state.activity.unshift({id:uid("gift"),date:today,text:`${t("dailyGift")} · +${coins} coin`});closeDialog();scheduleSave();renderAll();showToast(`+${xp} XP · +${coins} coin`,"good");playCoin();celebrate();checkAchievements()}
function openGift(){const claimed=state.dailyGiftDates.includes(localDateKey());showDialog(`<div style="text-align:center"><div class="feature-icon" style="margin:0 auto 11px;background:var(--gold-soft);color:#9b6514">${icon("gift",25)}</div><h2>${t("dailyGift")}</h2><p>${claimed?t("alreadyGift"):t("giftCopy")}</p><div class="dialog-actions one"><button class="${claimed?"ghost":"primary"}" data-action="${claimed?"close-dialog":"claim-gift"}">${claimed?t("close"):t("claim")}</button></div></div>`)}

function focusReward(minutes,category="mind"){return{xp:Math.max(8,Math.round(minutes*.6)),coins:Math.max(3,Math.round(minutes*.2)),energy:Math.max(6,Math.round(minutes*.7)),category:CATEGORIES[category]?category:"mind"}}
function openFocus(minutes=25,taskId=null,category="mind"){const f=state.focusTimer;if(f.running||f.startedAt){renderFocusDialog();return}const sec=clamp(Number(minutes)||25,10,60)*60;state.focusTimer={durationSec:sec,remainingSec:sec,running:false,endAt:0,startedAt:0,taskId:taskId||null,category:CATEGORIES[category]?category:"mind"};scheduleSave();renderFocusDialog()}
function startOrPauseFocus(){const f=state.focusTimer;if(f.running){f.remainingSec=Math.max(0,Math.ceil((f.endAt-Date.now())/1000));f.running=false;f.endAt=0;clearInterval(timerInterval)}else{if(f.remainingSec<=0)f.remainingSec=f.durationSec;f.running=true;if(!f.startedAt)f.startedAt=Date.now();f.endAt=Date.now()+f.remainingSec*1000;startTimerLoop()}persistNow();renderFocusDialog();renderFocusFloat()}
function startTimerLoop(){clearInterval(timerInterval);timerInterval=setInterval(()=>{const f=state.focusTimer;if(!f.running){clearInterval(timerInterval);return}f.remainingSec=Math.max(0,Math.ceil((f.endAt-Date.now())/1000));updateTimerDisplays();if(f.remainingSec<=0)completeFocus();else if(f.remainingSec%5===0)scheduleSave()},1000)}
function reconcileFocusTimer(allowComplete=true){const f=state.focusTimer;if(f.running){f.remainingSec=Math.max(0,Math.ceil((Number(f.endAt)-Date.now())/1000));if(f.remainingSec<=0){if(allowComplete)completeFocus();else{f.running=false;f.remainingSec=0}}else startTimerLoop()}}
function completeFocus(){const f=state.focusTimer,minutes=Math.round(f.durationSec/60),date=localDateKey(),sessionId=uid("focus"),task=f.taskId?state.tasks.find(x=>x.id===f.taskId):null,category=task?.category||f.category||"mind",reward=task?rewardForTask(task):focusReward(minutes,category);clearInterval(timerInterval);state.progress.focusMinutes+=minutes;state.tracking.focusSessions.unshift({id:sessionId,date,minutes,category,completedAt:new Date().toISOString()});if(task&&!task.completedDates.includes(date))task.completedDates.push(date);applyReward(task?rewardKey("task",task.id,date):rewardKey("focus",sessionId,date),reward,{activity:t("sessionComplete",{minutes})});state.focusTimer=defaultState().focusTimer;closeDialog(true);checkAchievements();persistNow();renderAll();showToast(t("completedReward",reward),"good");playLevel();celebrate(26)}
function backgroundFocus(){closeDialog(true);renderFocusFloat();showToast(t("background"))}
function askCancelFocus(){showDialog(`<h2>${t("confirmCancelSession")}</h2><p>${t("focusCopy")}</p><div class="dialog-actions"><button class="danger" data-action="confirm-cancel-focus">${t("cancelSession")}</button><button class="ghost" data-action="focus-back">${t("cancel")}</button></div>`)}
function cancelFocus(){clearInterval(timerInterval);state.focusTimer=defaultState().focusTimer;closeDialog(true);scheduleSave();renderFocusFloat();showToast(t("sessionCanceled"))}
function focusBack(){closeDialog(true);renderFocusDialog()}
function focusTimeText(){const sec=Math.max(0,Math.ceil(state.focusTimer.remainingSec||0)),m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function updateTimerDisplays(){const f=state.focusTimer,time=focusTimeText(),pct=100-(f.remainingSec/f.durationSec*100),timeEl=document.getElementById("timerValue"),ring=document.getElementById("timerRing");if(timeEl)timeEl.textContent=time;if(ring)ring.style.setProperty("--pct",`${clamp(pct,0,100)}%`);document.getElementById("focusFloatTime").textContent=time}
function renderFocusDialog(){const f=state.focusTimer,pct=100-(f.remainingSec/f.durationSec*100);showDialog(`<div class="timer"><h2>${t("focusTime")}</h2><p>${t("rewardFair")}</p><div class="timer-ring" id="timerRing" style="--pct:${clamp(pct,0,100)}%"><div><div class="timer-value" id="timerValue">${focusTimeText()}</div><div class="timer-label">${f.running?t("focusRunning"):f.startedAt?t("focusPaused"):t("focusReady")}</div></div></div><div class="timer-actions"><button class="primary" data-action="toggle-focus">${f.running?t("pause"):f.startedAt?t("resume"):t("start")}</button><button class="danger" data-action="cancel-focus">${t("cancelSession")}</button><button class="ghost background" data-action="background-focus">${t("background")}</button></div></div>`);document.getElementById("dialogBackdrop").dataset.focus="1"}

function renderHeader(){const info=levelInfo(),hour=new Date().getHours(),hello=hour<6?t("helloNight"):hour<12?t("helloMorning"):hour<18?t("helloDay"):t("helloEvening"),name=state.profile.name||"Habitopia";document.getElementById("greeting").textContent=`${hello}, ${name}`;document.getElementById("dateLabel").textContent=new Date().toLocaleDateString(state.settings.lang==="en"?"en-US":"tr-TR",{weekday:"long",day:"numeric",month:"long"}).toLocaleUpperCase(state.settings.lang==="en"?"en-US":"tr-TR");document.getElementById("levelLabel").textContent=t("level",{n:info.level});document.getElementById("xpFill").style.width=`${info.pct}%`;document.getElementById("coinCount").textContent=fmt(state.progress.coins)}

function renderToday(){const today=localDateKey(),tasks=dueTasks(),taskDone=tasks.filter(x=>x.completedDates.includes(today)).length,habit=todayHabitProgress(),total=taskDone+habit.done;document.getElementById("todaySubtitle").textContent=total?t("todayDone",{n:total}):t("todayEmpty");document.getElementById("heroLine").textContent=state.progress.currentStreak?t("dailyRhythm",{n:state.progress.currentStreak}):t("startToday");document.getElementById("heroPills").innerHTML=`<span class="pill">${t("taskCount",{done:taskDone,total:tasks.length})}</span><span class="pill">${t("habitCount",habit)}</span><span class="pill">${fmt(state.progress.focusMinutes)} ${t("minutesShort")}</span>`;document.getElementById("taskSummary").textContent=t("taskCount",{done:taskDone,total:tasks.length});document.getElementById("taskList").innerHTML=tasks.length?tasks.map(task=>{const done=task.completedDates.includes(today),r=rewardForTask(task);return `<article class="task ${done?"done":""}"><button class="task-check" data-action="toggle-task" data-id="${task.id}">${done?icon("check",18):task.type==="focus"?icon("timer",17):""}</button><div class="task-main"><div class="task-title">${esc(task.title)}</div><div class="task-meta"><span class="tiny">${task.type==="focus"?`${task.duration} ${t("minutesShort")}`:t(task.effort)}</span><span class="tiny">${categoryName(task.category)}</span></div></div><span class="reward">+${r.xp} XP · ${r.coins}</span><button class="more" data-action="ask-delete-task" data-id="${task.id}">⋯</button></article>`}).join(""):`<div class="empty"><strong>${t("noTasks")}</strong><p>${t("noTasksCopy")}</p><button class="secondary" style="margin-top:11px;min-height:38px" data-action="open-task">${t("add")}</button></div>`;renderWater();renderFocusFloat()}
function renderWater(){const r=currentWater(),pct=clamp(r.count/r.goal*100,0,100);document.getElementById("waterRing").style.setProperty("--pct",`${pct}%`);document.getElementById("waterValue").textContent=`${r.count}/${r.goal}`;document.getElementById("waterCopy").textContent=r.count>=r.goal?t("waterComplete"):t("waterRemaining",{n:Math.max(0,r.goal-r.count)});document.getElementById("waterLockNote").innerHTML=`${icon(r.count?"lock":"water",12)} ${r.count?t("waterLocked"):t("waterUnlocked")}`;document.getElementById("waterMinus").disabled=r.count<=0}

function renderHabits(){const dates=weekDates(),today=localDateKey(),start=dates[0],end=dates[6];document.getElementById("weekLabel").textContent=`${formatDate(start,true)} – ${formatDate(end,true)}`;const table=document.getElementById("habitTable");if(!state.habits.length){table.innerHTML=`<div class="empty" style="margin:10px"><strong>${t("noHabits")}</strong><p>${t("noHabitsCopy")}</p></div>`;document.getElementById("habitWeekScore").textContent=t("weekScore",{score:0});document.getElementById("habitStats").innerHTML="";return}const head=`<div class="habit-head"><div class="habit-label">${t("habits")}</div>${dates.map((d,i)=>`<div>${t(DAY_KEYS[i])}<br>${dateFromKey(d).getDate()}</div>`).join("")}</div>`;let due=0,done=0;const rows=state.habits.map(h=>{const cells=dates.map(date=>{const active=habitDue(h,date),isDone=h.completedDates.includes(date),future=date>today;if(active&&!future)due++;if(active&&!future&&isDone)done++;return `<button class="habit-day ${isDone?"done":""} ${date===today?"today":""}" data-action="toggle-habit" data-id="${h.id}" data-date="${date}" ${!active||future?"disabled":""}>${isDone?icon("check",14):""}</button>`}).join("");return `<div class="habit-row"><div class="habit-info" data-action="ask-delete-habit" data-id="${h.id}"><strong><i class="habit-score" style="--habit-color:${CATEGORIES[h.category].color}"></i>${esc(h.title)}</strong><span>${categoryName(h.category)}</span></div>${cells}</div>`}).join("");table.innerHTML=head+rows;const score=due?Math.round(done/due*100):0;document.getElementById("habitWeekScore").textContent=t("weekScore",{score});document.getElementById("habitStats").innerHTML=`<div class="stat"><span>${t("weekCompletions")}</span><strong>${done}/${due}</strong></div><div class="stat"><span>${t("totalHabits")}</span><strong>${state.habits.length}</strong></div><div class="stat"><span>${t("habitRate")}</span><strong>%${score}</strong></div><div class="stat"><span>${t("bestSeries")}</span><strong>${state.progress.longe function renderChallenges(){const c=currentChallenge(),host=document.getElementById("challengeContent");if(!c){host.innerHTML=`<div class="empty"><strong>${t("noChallenge")}</strong><p>${t("noChallengeCopy")}</p><button class="primary" style="margin-top:12px" data-action="add-challenge">${t("create21")}</button></div>`;return}activeChallengeId=c.id;const done=challengeDoneCount(c),pct=Math.round(done/21*100),today=localDateKey();host.innerHTML=`<div class="challenge-summary"><div><strong>${esc(c.title)}</strong><p>${formatDate(c.startDate)} · ${done}/21 ${t("completed")}</p></div><div class="challenge-ring" style="--pct:${pct}%"><b>%${pct}</b></div></div><div class="challenge-tabs"><button class="active">${t("active")}</button><button data-action="challenge-help">${t("howItWorks")}</button><button data-action="ask-delete-challenge" data-id="${c.id}">${t("delete")}</button></div><div class="card"><div class="challenge-grid">${Array.from({length:21},(_,i)=>{const day=i+1,date=challengeDayDate(c,day),status=c.statuses[day]||"",future=date>today;return `<button class="challenge-day ${status} ${date===today?"today":""} ${future?"future":""}" data-action="challenge-day" data-id="${c.id}" data-day="${day}" ${future?"disabled":""}><b>${day}</b><span>${t("day")}</span></button>`}).join("")}</div><div class="challenge-legend"><span class="legend"><i style="background:var(--green)"></i>${t("done")}</span><span class="legend"><i style="background:var(--yellow)"></i>${t("partial")}</span><span class="legend"><i style="background:var(--red)"></i>${t("missed")}</span><span class="legend"><i style="background:#e7ebe6"></i>${t("waiting")}</span></div></div><div class="section-head"><h2>${t("allChallenges")}</h2><span>${state.challenges.length}</span></div><div class="challenge-list">${state.challenges.map(x=>`<button class="challenge-item ${x.id===c.id?"active":""}" data-action="select-challenge" data-id="${x.id}"><div class="feature-icon">${icon("challenge",19)}</div><div class="challenge-copy"><strong>${esc(x.title)}</strong><span>${challengeDoneCount(x)}/21 · ${formatDate(x.startDate,true)}</span></div><span>›</span></button>`).join("")}</div>`}

function renderProfile(){const days=lastDays(7),r=currentWater(),waterDone=days.filter(d=>{const x=state.water.records[d.key];return x&&x.count>=x.goal}).length,focusWeek=state.tracking.focusSessions.filter(x=>days.some(d=>d.key===x.date)).reduce((n,x)=>n+Number(x.minutes),0),latest=state.tracking.weights[state.tracking.weights.length-1],notes=state.tracking.notes;document.getElementById("trackerWaterValue").textContent=`${r.count} / ${r.goal}`;document.getElementById("trackerWaterCopy").textContent=`${waterDone}/7 ${t("goalCompleted")}`;document.getElementById("trackerWeightValue").textContent=latest?`${decimal(latest.value)} ${t("kg")}`:t("noRecord");document.getElementById("trackerWeightCopy").textContent=latest?formatDate(latest.date,true):t("firstMeasure");document.getElementById("trackerFocusValue").textContent=`${fmt(focusWeek)} ${t("minutesShort")}`;document.getElementById("trackerFocusCopy").textContent=`${state.tracking.focusSessions.filter(x=>days.some(d=>d.key===x.date)).length} ${t("sessions")}`;document.getElementById("trackerNotesValue").textContent=`${notes.length} ${t("notes")}`;document.getElementById("trackerNotesCopy").textContent=`${notes.filter(x=>x.pinned).length} ${t("pinned")}`;const habitMarks=state.habits.reduce((n,h)=>n+h.completedDates.length,0);document.getElementById("generalStats").innerHTML=`<div class="stat"><span>${t("completedTasks")}</span><strong>${fmt(state.progress.totalCompleted)}</strong></div><div class="stat"><span>${t("focusMinutes")}</span><strong>${fmt(state.progress.focusMinutes)} ${t("minutesShort")}</strong></div><div class="stat"><span>${t("currentStreak")}</span><strong>${state.progress.currentStreak}</strong></div><div class="stat"><span>${t("habitRate")}</span><strong>${habitMarks}</strong></div>`;const values=days.map(d=>Number(state.progress.dayCounts[d.key])||0),max=Math.max(1,...values),total=values.reduce((a,b)=>a+b,0);document.getElementById("weekActivityTotal").textContent=`${total} ${t("completed")}`;document.getElementById("weekActivityChart").innerHTML=days.map((d,i)=>`<div class="bar-col"><em>${values[i]}</em><i style="--h:${Math.max(5,values[i]/max*92)}px"></i><span>${t(DAY_KEYS[dayIndexMonday(d.key)])}</span></div>`).join("");renderHabitPerformance(days);document.getElementById("badgeSummary").textContent=`${state.achievements.length}/${ACHIEVEMENTS.length}`;document.getElementById("badgeGrid").innerHTML=ACHIEVEMENTS.map(a=>{const unlocked=state.achievements.includes(a.id);return `<div class="badge ${unlocked?"":"locked"}"><div class="feature-icon">${icon(unlocked?"trophy":"spark",19)}</div><strong>${esc(state.settings.lang==="en"?a.nameEn:a.nameTr)}</strong><p>${esc(state.settings.lang==="en"?a.copyEn:a.copyTr)}</p></div>`}).join("")}
function renderHabitPerformance(days){const rows=state.habits.slice(0,6).map(h=>{const due=days.filter(d=>habitDue(h,d.key)).length,done=days.filter(d=>habitDue(h,d.key)&&h.completedDates.includes(d.key)).length,pct=due?Math.round(done/due*100):0;return `<div style="margin:0 0 12px"><div class="row between"><strong style="font-size:11px">${esc(h.title)}</strong><span style="font-size:10px;color:var(--muted)">%${pct}</span></div><div style="height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${pct}%;background:${CATEGORIES[h.category].color};border-radius:inherit"></i></div></div>`}).join("");document.getElementById("habitPerformanceLabel").textContent=t("thisWeek");document.getElementById("habitPerformance").innerHTML=rows||`<div class="empty"><strong>${t("noHabits")}</strong><p>${t("noHabitsCopy")}</p></div>`}

function openWeight(){document.getElementById("weightDateInput").value=localDateKey();document.getElementById("weightDateInput").max=localDateKey();document.getElementById("weightInput").value="";renderWeight();openSheet("weightSheet")}
function saveWeight(){const value=Number(String(document.getElementById("weightInput").value).replace(",",".")),date=document.getElementById("weightDateInput").value||localDateKey();if(!Number.isFinite(value)||value<25||value>350){showToast(t("invalidWeight"),"bad");return}if(date>localDateKey()){showToast(t("futureDate"),"bad");return}const existing=state.tracking.weights.find(x=>x.date===date);if(existing){existing.value=Math.round(value*10)/10;existing.createdAt=new Date().toISOString()}else state.tracking.weights.push({id:uid("weight"),date,value:Math.round(value*10)/10,createdAt:new Date().toISOString()});state.tracking.weights.sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));document.getElementById("weightInput").value="";scheduleSave();renderWeight();renderProfile();showToast(t(existing?"measurementUpdated":"measurementSaved"),"good")}
function weightChart(records){if(!records.length)return`<div class="empty"><strong>${t("noRecord")}</strong><p>${t("firstMeasure")}</p></div>`;const items=records.slice(-12),vals=items.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min),w=390,h=145,p=22,points=items.map((x,i)=>({x:items.length===1?w/2:p+i*(w-p*2)/(items.length-1),y:h-p-(x.value-min)/span*(h-p*2),value:x.value})),line=points.map(x=>`${x.x},${x.y}`).join(" ");return`<svg class="line-chart" viewBox="0 0 ${w} ${h}" role="img"><defs><linearGradient id="weightLine" x1="0" x2="1"><stop stop-color="#e44035"/><stop offset=".35" stop-color="#f39a31"/><stop offset=".68" stop-color="#c2b92c"/><stop offset="1" stop-color="#16ad5a"/></linearGradient><linearGradient id="weightFill" x1="0" x2="1"><stop stop-color="#fde8e4"/><stop offset=".5" stop-color="#fff3d7"/><stop offset="1" stop-color="#e1f8e9"/></linearGradient></defs><path d="M${points[0].x} ${h-p} L${line.replace(/ /g," L")} L${points[points.length-1].x} ${h-p}Z" fill="url(#weightFill)" opacity=".8"/><polyline points="${line}" fill="none" stroke="url(#weightLine)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${points.map((pt,i)=>`<circle cx="${pt.x}" cy="${pt.y}" r="6" fill="${i===points.length-1?"#16ad5a":i===0?"#e44035":"#f2a234"}" stroke="#fff" stroke-width="3"/>`).join("")}</svg>`}
function renderWeight(){const list=state.tracking.weights,latest=list[list.length-1],first=list[0],change=latest&&first?latest.value-first.value:0;document.getElementById("weightContent").innerHTML=`<div class="weight-hero"><div class="weight-top"><div><span>${t("latestMeasure")}</span><strong>${latest?decimal(latest.value)+" "+t("kg"):"—"}</strong></div>${list.length>1?`<span class="delta ${change>0?"up":""}">${change>0?"↑ +":"↓ "}${decimal(Math.abs(change))} ${t("kg")}</span>`:""}</div>${weightChart(list)}</div><div class="section-head"><h2>${t("history")}</h2><span>${list.length} ${t("records")}</span></div><div class="weight-history">${list.length?list.slice().reverse().slice(0,20).map((x,idx,rev)=>{const chronological=list,originalIndex=chronological.findIndex(y=>y.id===x.id),prev=originalIndex>0?chronological[originalIndex-1]:null,delta=prev?x.value-prev.value:0;return `<div class="weight-record"><div class="weight-record-main"><span>${formatDate(x.date)}</span><strong>${decimal(x.value)} ${t("kg")}</strong></div>${prev?`<span class="delta ${delta>0?"up":""}">${delta>0?"↑ +":"↓ "}${decimal(Math.abs(delta))}</span>`:""}<button class="more" data-action="delete-weight" data-id="${x.id}">×</button></div>`}).join(""):`<div class="empty"><strong>${t("noRecord")}</strong><p>${t("firstMeasure")}</p></div>`}</div>`}
function deleteWeight(id){state.tracking.weights=state.tracking.weights.filter(x=>x.id!==id);scheduleSave();renderWeight();renderProfile()}
function openFocusStats(){renderFocusStats();openSheet("focusStatsSheet")}
function renderFocusStats(){const days=lastDays(7),values=days.map(d=>state.tracking.focusSessions.filter(x=>x.date===d.key).reduce((n,x)=>n+Number(x.minutes),0)),week=values.reduce((a,b)=>a+b,0),max=Math.max(1,...values),count=state.tracking.focusSessions.filter(x=>days.some(d=>d.key===x.date)).length;document.getElementById("focusStatsContent").innerHTML=`<div class="weight-hero" style="background:linear-gradient(145deg,#eee9f8,#faf8ff);border-color:#ded6ef"><div class="weight-top"><div><span>${t("thisWeek")}</span><strong style="color:var(--purple)">${fmt(week)} ${t("minutesShort")}</strong></div><span class="delta" style="background:#eee9f8;color:var(--purple)">${count} ${t("sessions")}</span></div><div class="bar-chart">${days.map((d,i)=>`<div class="bar-col"><em>${values[i]}</em><i style="--h:${Math.max(5,values[i]/max*92)}px;background:linear-gradient(#9a83bb,#745e9a)"></i><span>${t(DAY_KEYS[dayIndexMonday(d.key)])}</span></div>`).join("")}</div></div><div class="stat-grid"><div class="stat"><span>${t("totalFocus")}</span><strong>${fmt(state.progress.focusMinutes)}</strong></div><div class="stat"><span>${t("sessions")}</span><strong>${state.tracking.focusSessions.length}</strong></div></div>`}

function openNotes(){resetNoteEditor();renderNotes();openSheet("notesSheet")}
function renderNoteColors(){document.getElementById("noteColors").innerHTML=NOTE_COLORS.map(color=>`<button class="note-color ${selectedNoteColor===color?"active":""}" style="--note:${color}" data-action="note-color" data-color="${color}"></button>`).join("")}
function resetNoteEditor(){document.getElementById("editingNoteId").value="";document.getElementById("noteTitleInput").value="";document.getElementById("noteBodyInput").value="";document.getElementById("noteSaveButton").textContent=t("save");selectedNoteColor=NOTE_COLORS[0];renderNoteColors()}
function saveNote(){const title=document.getElementById("noteTitleInput").value.trim(),body=document.getElementById("noteBodyInput").value.trim(),id=document.getElementById("editingNoteId").value;if(!title&&!body){showToast(t("emptyNote"),"bad");return}const now=new Date().toISOString();if(id){const n=state.tracking.notes.find(x=>x.id===id);if(n){n.title=(title||t("notebook")).slice(0,60);n.body=body.slice(0,3000);n.color=selectedNoteColor;n.updatedAt=now}}else state.tracking.notes.unshift({id:uid("note"),title:(title||t("notebook")).slice(0,60),body:body.slice(0,3000),color:selectedNoteColor,pinned:false,createdAt:now,updatedAt:now});scheduleSave();resetNoteEditor();renderNotes();renderProfile();checkAchievements();showToast(t(id?"noteUpdated":"noteSaved"),"good")}
function renderNotes(){renderNoteColors();const q=(document.getElementById("noteSearchInput").value||"").toLocaleLowerCase(state.settings.lang==="en"?"en-US":"tr-TR"),notes=state.tracking.notes.slice().sort((a,b)=>Number(b.pinned)-Number(a.pinned)||new Date(b.updatedAt)-new Date(a.updatedAt)).filter(n=>!q||`${n.title} ${n.body}`.toLocaleLowerCase().includes(q));document.getElementById("notesList").innerHTML=notes.length?notes.map(n=>`<article class="note" style="--note:${n.color}"><div class="note-head"><strong>${n.pinned?"📌 ":""}${esc(n.title)}</strong><div class="note-actions"><button data-action="pin-note" data-id="${n.id}">${t(n.pinned?"unpin":"pin")}</button><button data-action="edit-note" data-id="${n.id}">${t("edit")}</button><button data-action="delete-note" data-id="${n.id}">${t("delete")}</button></div></div>${n.body?`<p>${esc(n.body)}</p>`:""}<span style="font-size:9px;color:var(--muted)">${new Date(n.updatedAt).toLocaleDateString(state.settings.lang==="en"?"en-US":"tr-TR")}</span></article>`).join(""):`<div class="empty"><strong>${t("noNotes")}</strong></div>`}
function pinNote(id){const n=state.tracking.notes.find(x=>x.id===id);if(!n)return;n.pinned=!n.pinned;n.updatedAt=new Date().toISOString();scheduleSave();renderNotes();renderProfile()}
function editNote(id){const n=state.tracking.notes.find(x=>x.id===id);if(!n)return;document.getElementById("editingNoteId").value=n.id;document.getElementById("noteTitleInput").value=n.title;document.getElementById("noteBodyInput").value=n.body;selectedNoteColor=n.color;document.getElementById("noteSaveButton").textContent=t("edit");renderNoteColors();document.getElementById("noteTitleInput").focus()}
function deleteNote(id){state.tracking.notes=state.tracking.notes.filter(x=>x.id!==id);scheduleSave();resetNoteEditor();renderNotes();renderProfile()}

function openSettings(){renderSettings();openSheet("settingsSheet")}
function renderSettings(){const r=currentWater();document.getElementById("nameInput").value=state.profile.name;document.getElementById("languageInput").value=state.settings.lang;fillWaterGoals();document.getElementById("waterGoalInput").value=r.count>0?r.goal:state.water.defaultGoal;document.getElementById("waterGoalInput").disabled=r.count>0;document.getElementById("waterGoalHelp").textContent=r.count?t("waterGoalLocked"):t("waterGoalHistory");const items=[{id:"sound",icon:"volume",name:"sound",copy:"soundCopy"},{id:"dark",icon:"moon",name:"dark",copy:"darkCopy"},{id:"reduceMotion",icon:"motion",name:"reduceMotion",copy:"reduceMotionCopy"}];document.getElementById("settingsList").innerHTML=items.map(x=>`<div class="setting"><div class="feature-icon" style="width:34px;height:34px">${icon(x.icon,17)}</div><div class="setting-copy"><strong>${t(x.name)}</strong><span>${t(x.copy)}</span></div><button class="switch ${state.settings[x.id]?"on":""}" data-action="toggle-setting" data-id="${x.id}"><i></i></button></div>`).join("")}
function changeLanguage(lang){state.settings.lang=lang==="en"?"en":"tr";applyTranslations();renderStatic();renderAll();renderSettings();scheduleSave();showToast(t("languageChanged"),"good")}
function toggleSetting(id){if(!["sound","dark","reduceMotion"].includes(id))return;state.settings[id]=!state.settings[id];applySettings();renderSettings()}
function updateName(value){state.profile.name=String(value).slice(0,28);scheduleSave();renderHeader()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`habitopia-v7-${localDateKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast(t("dataExported"),"good")}
function importData(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=="object")throw new Error();state=normalizeState(parsed);applySettings();applyTranslations();renderStatic();renderAll();document.getElementById("onboarding").classList.toggle("hidden",!!state.onboardingDone);closeSheet("settingsSheet");persistNow();showToast(t("dataImported"),"good")}catch(error){showToast(t("invalidBackup"),"bad")}};reader.readAsText(file);event.target.value=""}
function askReset(){showDialog(`<h2>${t("confirmReset")}</h2><p>${t("resetCopy")}</p><div class="dialog-actions"><button class="danger" data-action="confirm-reset">${t("reset")}</button><button class="ghost" data-action="close-dialog">${t("cancel")}</button></div>`)}
async function resetAll(){clearInterval(timerInterval);state=defaultState();await storageAdapter.remove(STORAGE_KEY);await storageAdapter.remove(BACKUP_KEY);await persistNow();closeDialog(true);closeSheet("settingsSheet");applySettings();applyTranslations();renderStatic();renderAll();document.getElementById("onboarding").classList.remove("hidden");showOnboarding(0)}

function renderOnboarding(){document.querySelectorAll("[data-ob-lang]").forEach(b=>b.classList.toggle("active",b.dataset.obLang===state.settings.lang));document.getElementById("obName").value=state.profile.name;document.getElementById("obGoals").innerHTML=GOAL_IDS.map(id=>`<button class="goal-card ${state.profile.goal===id?"active":""}" data-action="ob-goal" data-id="${id}"><strong>${t(id)}</strong><span>${categoryName(id==="focusGoal"?"mind":id==="healthGoal"?"health":id==="orderGoal"?"order":"social")}</span></button>`).join("");document.getElementById("obHabit").value=state.settings.lang==="en"?"Read for 10 minutes":"10 dakika kitap oku";fillWaterGoals();document.getElementById("obWaterGoal").value=state.water.defaultGoal;validateOnboarding()}
function showOnboarding(step){document.querySelectorAll(".ob-step").forEach(x=>x.classList.toggle("active",Number(x.dataset.ob)===Number(step)));if(step===1||step===2)renderOnboarding()}
function validateOnboarding(){const name=document.getElementById("obName")?.value.trim()||state.profile.name;document.getElementById("obGoalNext").disabled=name.length<2||!GOAL_IDS.includes(state.profile.goal)}
function selectOnboardingLanguage(lang){state.settings.lang=lang==="en"?"en":"tr";applyTranslations();renderStatic();renderOnboarding();applySettings()}
function selectGoal(id){if(!GOAL_IDS.includes(id))return;state.profile.goal=id;renderOnboarding()}
function onboardingNext(step){if(Number(step)===2){const name=document.getElementById("obName").value.trim();if(name.length<2){showToast(t("nameRequired"),"bad");return}if(!GOAL_IDS.includes(state.profile.goal)){showToast(t("goalRequired"),"bad");return}state.profile.name=name}showOnboarding(step)}
async function finishOnboarding(){const title=document.getElementById("obHabit").value.trim();if(!title){showToast(t("habitRequired"),"bad");return}state.profile.name=document.getElementById("obName").value.trim()||state.profile.name||"Habitopia";state.water.defaultGoal=clamp(Number(document.getElementById("obWaterGoal").value)||8,1,20);state.water.records[localDateKey()]={count:0,goal:state.water.defaultGoal,rewarded:false};if(!state.habits.length)state.habits.push({id:uid("habit"),title,category:goalCategory(),activeDays:[0,1,2,3,4,5,6],completedDates:[],createdAt:new Date().toISOString()});if(!state.challenges.length)state.challenges.push({id:uid("challenge"),title:state.settings.lang==="en"?"My first 21-day challenge":"İlk 21 günlük challenge'ım",category:goalCategory(),startDate:localDateKey(),statuses:{},createdAt:new Date().toISOString()});state.onboardingDone=true;state.activity.unshift({id:uid("start"),date:localDateKey(),text:"Habitopia v7"});await persistNow();document.getElementById("onboarding").classList.add("hidden");renderAll();showToast(t("welcomeReady"),"good");celebrate(28)}

function showView(name){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===`view-${name}`));document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.view===name));document.getElementById("main").scrollTop=0;if(name==="habits")renderHabits();if(name==="challenges")renderChallenges();if(name==="profile")renderProfile()}
function openSheet(id){document.getElementById(id)?.classList.add("open")}
function closeSheet(id){document.getElementById(id)?.classList.remove("open")}
function showDialog(html){document.getElementById("dialogBody").innerHTML=html;document.getElementById("dialogBackdrop").classList.add("open")}
function closeDialog(force=false){const back=document.getElementById("dialogBackdrop");if(back.dataset.focus&&!force&&state.focusTimer.running){backgroundFocus();return}back.classList.remove("open");back.dataset.focus=""}
function showToast(message,type=""){const el=document.getElementById("toast");el.textContent=message;el.className=`toast show ${type}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className="toast",3000)}
function celebrate(count=20){if(state.settings.reduceMotion)return;const host=document.getElementById("celebrate"),colors=["#e5a63d","#5f9469","#d16a5d","#5d87a0","#8d6d9d"];host.innerHTML="";for(let i=0;i<count;i++){const el=document.createElement("i");el.className="confetti";el.style.left=`${15+Math.random()*70}%`;el.style.background=colors[i%colors.length];el.style.setProperty("--x",`${(Math.random()-.5)*300}px`);el.style.animationDelay=`${Math.random()*.15}s`;host.appendChild(el)}setTimeout(()=>host.innerHTML="",1550)}
function playTone(freq,duration=.12,delay=0){if(!state.settings.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),start=audioContext.currentTime+delay;osc.frequency.value=freq;gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(.11,start+.01);gain.gain.exponentialRampToValueAtTime(.001,start+duration);osc.connect(gain).connect(audioContext.destination);osc.start(start);osc.stop(start+duration+.02)}catch(error){}}
function playSuccess(){playTone(620,.12);playTone(870,.15,.08)}function playCoin(){playTone(1030,.1);playTone(1320,.12,.06)}function playLevel(){playTone(520,.12);playTone(660,.12,.1);playTone(880,.22,.2)}
function renderAll(){currentWater();updateStreak();applyTranslations();renderHeader();renderToday();renderHabits();renderChallenges();checkAchievements();renderProfile();renderSettings();renderFocusFloat()}

function handleAction(action,el){const id=el.dataset.id,date=el.dataset.date,day=Number(el.dataset.day);switch(action){case"gift":openGift();break;case"claim-gift":claimGift();break;case"quick-task":addQuickTask();break;case"open-task":openTaskSheet();break;case"save-task":saveTask();break;case"effort":selectedEffort=id;renderTaskForm();break;case"toggle-task":toggleTask(id);break;case"ask-delete-task":askDeleteTask(id);break;case"delete-task":deleteTask(id);break;case"water-plus":changeWater(1);break;case"water-minus":changeWater(-1);break;case"open-focus":closeSheet("focusStatsSheet");openFocus();break;case"reopen-focus":renderFocusDialog();break;case"toggle-focus":startOrPauseFocus();break;case"background-focus":backgroundFocus();break;case"cancel-focus":askCancelFocus();break;case"confirm-cancel-focus":cancelFocus();break;case"focus-back":focusBack();break;case"add-habit":openHabitSheet();break;case"habit-day-choice":el.classList.toggle("active");break;case"save-habit":saveHabit();break;case"toggle-habit":toggleHabit(id,date);break;case"ask-delete-habit":askDeleteHabit(id);break;case"delete-habit":deleteHabit(id);break;case"week-prev":weekOffset--;renderHabits();break;case"week-next":if(weekOffset<0)weekOffset++;renderHabits();break;case"add-challenge":openChallengeSheet();break;case"save-challenge":saveChallenge();break;case"challenge-day":cycleChallengeDay(id,day);break;case"select-challenge":activeChallengeId=id;renderChallenges();break;case"challenge-help":showDialog(`<h2>${t("howItWorks")}</h2><p>${t("challengeHelp")}</p><div class="dialog-actions one"><button class="primary" data-action="close-dialog">${t("close")}</button></div>`);break;case"ask-delete-challenge":askDeleteChallenge(id);break;case"delete-challenge":deleteChallenge(id);break;case"water-stats":openWaterStats();break;case"weight":openWeight();break;case"save-weight":saveWeight();break;case"delete-weight":deleteWeight(id);break;case"focus-stats":openFocusStats();break;case"notes":openNotes();break;case"note-color":selectedNoteColor=el.dataset.color;renderNoteColors();break;case"save-note":saveNote();break;case"pin-note":pinNote(id);break;case"edit-note":editNote(id);break;case"delete-note":deleteNote(id);break;case"settings":openSettings();break;case"toggle-setting":toggleSetting(id);break;case"export":exportData();break;case"import":document.getElementById("importFile").click();break;case"reset":askReset();break;case"confirm-reset":resetAll();break;case"close-dialog":closeDialog(true);break;case"ob-next":onboardingNext(Number(el.dataset.step));break;case"ob-goal":selectGoal(id);break;case"finish-onboarding":finishOnboarding();break}}
function bindEvents(){document.addEventListener("click",event=>{const close=event.target.closest("[data-close]");if(close){closeSheet(close.dataset.close);return}const lang=event.target.closest("[data-ob-lang]");if(lang){selectOnboardingLanguage(lang.dataset.obLang);return}const nav=event.target.closest(".nav-btn");if(nav){showView(nav.dataset.view);return}const action=event.target.closest("[data-action]");if(action)handleAction(action.dataset.action,action)});document.querySelectorAll(".sheet-backdrop").forEach(back=>back.addEventListener("click",event=>{if(event.target===back)closeSheet(back.id)}));document.getElementById("dialogBackdrop").addEventListener("click",event=>{if(event.target===event.currentTarget&&!state.focusTimer.running)closeDialog(true)});document.getElementById("taskTypeInput").addEventListener("change",renderTaskForm);document.getElementById("quickTask").addEventListener("keydown",event=>{if(event.key==="Enter")addQuickTask()});document.getElementById("noteSearchInput").addEventListener("input",renderNotes);document.getElementById("nameInput").addEventListener("input",event=>updateName(event.target.value));document.getElementById("languageInput").addEventListener("change",event=>changeLanguage(event.target.value));document.getElementById("waterGoalInput").addEventListener("change",event=>updateWaterGoal(event.target.value));document.getElementById("importFile").addEventListener("change",importData);document.getElementById("obName").addEventListener("input",validateOnboarding);document.addEventListener("visibilitychange",()=>{if(!document.hidden){reconcileFocusTimer(true);currentWater();renderAll()}else persistNow()});window.addEventListener("beforeunload",()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){}})}

async function init(){state=defaultState();bindEvents();await loadState();applyTranslations();renderStatic();renderOnboarding();reconcileFocusTimer(true);renderAll();document.getElementById("onboarding").classList.toggle("hidden",!!state.onboardingDone)}
init();
</script>
</body>
</html>
