function t(key,vars={}){const lang=state?.settings?.lang||"tr";let text=(I18N[lang]&&I18N[lang][key])??I18N.tr[key]??key;Object.entries(vars).forEach(([k,v])=>{text=text.split(`{${k}}`).join(String(v))});return text}
function esc(value){return String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]))}
function safeId(value,prefix="id"){const clean=String(value||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,70);return clean||uid(prefix)}
function uid(prefix="id"){return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`}
function dateFromKey(key){const [y,m,d]=String(key).split("-").map(Number);return new Date(y,m-1,d,12)}
function addDays(key,days){const d=dateFromKey(key);d.setDate(d.getDate()+days);return localDateKey(d)}
function daysBetween(a,b){return Math.floor((dateFromKey(b)-dateFromKey(a))/86400000)}
function mondayOf(key=localDateKey()){const d=dateFromKey(key),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return localDateKey(d)}
function lastDays(count=7){const today=localDateKey();return Array.from({length:count},(_,i)=>{const key=addDays(today,i-count+1);return{key,date:dateFromKey(key)}})}
function fmt(value){return new Intl.NumberFormat(state?.settings?.lang==="en"?"en-US":"tr-TR").format(Number(value)||0)}
function decimal(value){return Number(value).toLocaleString(state?.settings?.lang==="en"?"en-US":"tr-TR",{maximumFractionDigits:1})}
function formatDate(key,short=false){try{return dateFromKey(key).toLocaleDateString(state?.settings?.lang==="en"?"en-US":"tr-TR",short?{day:"numeric",month:"short"}:{day:"numeric",month:"long",year:"numeric"})}catch(error){return key}}
function categoryName(id){return t(id==="health"?"healthArea":id)}
function dayIndexMonday(key){return (dateFromKey(key).getDay()+6)%7}

function checkAchievements(){const fresh=[];ACHIEVEMENTS.forEach(a=>{let ok=false;try{ok=a.check(state)}catch(error){}if(ok&&!state.achievements.includes(a.id)){state.achievements.push(a.id);fresh.push(a)}});if(fresh.length){const coins=fresh.length*10;state.progress.coins+=coins;fresh.forEach(a=>state.activity.unshift({id:uid("badge"),date:localDateKey(),text:`${state.settings.lang==="en"?a.nameEn:a.nameTr} · +10 coin`}));showToast(t("badgeOpened",{count:fresh.length,coins}),"good");playLevel();scheduleSave()}return fresh}

function addQuickTask(){const input=document.getElementById("quickTask"),title=input.value.trim();if(!title){openTaskSheet();return}state.tasks.unshift({id:uid("task"),title,type:"once",category:goalCategory(),effort:"normal",duration:25,completedDates:[],createdAt:new Date().toISOString()});input.value="";scheduleSave();renderToday();showToast(t("taskAdded"),"good")}
function openTaskSheet(){selectedEffort="normal";document.getElementById("taskTitleInput").value="";document.getElementById("taskTypeInput").value="once";document.getElementById("taskCategoryInput").value=goalCategory();renderTaskForm();openSheet("taskSheet");setTimeout(()=>document.getElementById("taskTitleInput").focus(),220)}
function renderTaskForm(){const type=document.getElementById("taskTypeInput").value;document.getElementById("effortField").hidden=type==="focus";document.getElementById("taskDurationField").hidden=type!=="focus";document.getElementById("effortChoices").innerHTML=Object.keys(EFFORTS).map(id=>`<button class="choice ${selectedEffort===id?"active":""}" data-action="effort" data-id="${id}">${t(id)}</button>`).join("")}
function saveTask(){const title=document.getElementById("taskTitleInput").value.trim();if(!title){showToast(t("titleRequired"),"bad");return}state.tasks.unshift({id:uid("task"),title,type:document.getElementById("taskTypeInput").value==="focus"?"focus":"once",category:document.getElementById("taskCategoryInput").value,effort:selectedEffort,duration:clamp(Number(document.getElementById("taskDurationInput").value)||25,5,180),completedDates:[],createdAt:new Date().toISOString()});closeSheet("taskSheet");scheduleSave();renderToday();showToast(t("taskAdded"),"good")}
function toggleTask(id){const task=state.tasks.find(x=>x.id===id);if(!task)return;const today=localDateKey(),done=task.completedDates.includes(today);if(done){task.completedDates=task.completedDates.filter(d=>d!==today);revokeReward(rewardKey("task",task.id,today),{fallbackCompletion:true,date:today});scheduleSave();renderAll();showToast(t("undoDone"));return}if(task.type==="focus"){openFocus(task.duration,task.id,task.category);return}task.completedDates.push(today);const reward=rewardForTask(task);applyReward(rewardKey("task",task.id,today),reward,{activity:`${task.title} · ${t("done")}`});checkAchievements();scheduleSave();renderAll();showToast(t("completedReward",reward),"good");celebrate()}
function askDeleteTask(id){const task=state.tasks.find(x=>x.id===id);if(!task)return;showDialog(`<h2>${t("deleteTask")}</h2><p>${esc(task.title)}</p><div class="dialog-actions"><button class="danger" data-action="delete-task" data-id="${task.id}">${t("yesDelete")}</button><button class="ghost" data-action="close-dialog">${t("cancel")}</button></div>`)}
function deleteTask(id){const task=state.tasks.find(x=>x.id===id);if(task){task.completedDates.forEach(date=>revokeReward(rewardKey("task",task.id,date),{fallbackCompletion:true,date}))}state.tasks=state.tasks.filter(x=>x.id!==id);closeDialog();scheduleSave();renderAll();showToast(t("rewardRemoved"))}

function goalCategory(){return state.profile.goal==="healthGoal"?"health":state.profile.goal==="orderGoal"?"order":state.profile.goal==="focusGoal"?"mind":"social"}
function weekDates(){const start=addDays(mondayOf(),weekOffset*7);return Array.from({length:7},(_,i)=>addDays(start,i))}
function habitDue(habit,date){return habit.activeDays.includes(dayIndexMonday(date))}
function openHabitSheet(){document.getElementById("habitTitleInput").value="";document.getElementById("habitCategoryInput").value=goalCategory();document.getElementById("habitDayChoices").innerHTML=DAY_KEYS.map((key,i)=>`<button class="choice active" data-action="habit-day-choice" data-day="${i}">${t(key)}</button>`).join("");openSheet("habitSheet")}
function saveHabit(){const title=document.getElementById("habitTitleInput").value.trim(),days=[...document.querySelectorAll("#habitDayChoices .choice.active")].map(x=>Number(x.dataset.day));if(!title){showToast(t("titleRequired"),"bad");return}if(!days.length){showToast(t("activeDaysRequired"),"bad");return}state.habits.unshift({id:uid("habit"),title,category:document.getElementById("habitCategoryInput").value,activeDays:days,completedDates:[],createdAt:new Date().toISOString()});closeSheet("habitSheet");scheduleSave();renderHabits();showToast(t("habitAdded"),"good")}
function toggleHabit(id,date){const habit=state.habits.find(x=>x.id===id);if(!habit||date>localDateKey()||!habitDue(habit,date)){if(date>localDateKey())showToast(t("futureDisabled"));return}const done=habit.completedDates.includes(date),key=rewardKey("habit",habit.id,date),reward={xp:8,coins:3,energy:5,category:habit.category};if(done){habit.completedDates=habit.completedDates.filter(d=>d!==date);revokeReward(key,{fallbackCompletion:true,date});showToast(t("undoDone"))}else{habit.completedDates.push(date);applyReward(key,reward,{activity:`${habit.title} · ${formatDate(date,true)}`});showToast(t("completedReward",reward),"good");celebrate(12)}checkAchievements();scheduleSave();renderAll()}
function askDeleteHabit(id){const habit=state.habits.find(x=>x.id===id);if(!habit)return;showDialog(`<h2>${t("deleteHabit")}</h2><p>${esc(habit.title)}</p><div class="dialog-actions"><button class="danger" data-action="delete-habit" data-id="${habit.id}">${t("yesDelete")}</button><button class="ghost" data-action="close-dialog">${t("cancel")}</button></div>`)}
function deleteHabit(id){const habit=state.habits.find(x=>x.id===id);if(habit){habit.completedDates.forEach(date=>revokeReward(rewardKey("habit",habit.id,date),{fallbackCompletion:true,date}))}state.habits=state.habits.filter(x=>x.id!==id);closeDialog();scheduleSave();renderAll();showToast(t("rewardRemoved"))}

function challengeDayDate(challenge,day){return addDays(challenge.startDate,day-1)}
function challengeDoneCount(c){return Object.values(c.statuses).filter(v=>v==="done").length}
function currentChallenge(){const active=state.challenges.find(x=>x.id===activeChallengeId);if(active)return active;const running=state.challenges.find(c=>daysBetween(c.startDate,localDateKey())>=0&&daysBetween(c.startDate,localDateKey())<21);return running||state.challenges[0]||null}
function openChallengeSheet(){document.getElementById("challengeTitleInput").value="";document.getElementById("challengeStartInput").value=localDateKey();document.getElementById("challengeStartInput").max=localDateKey();document.getElementById("challengeCategoryInput").value=goalCategory();openSheet("challengeSheet")}
function saveChallenge(){const title=document.getElementById("challengeTitleInput").value.trim(),start=document.getElementById("challengeStartInput").value||localDateKey();if(!title){showToast(t("titleRequired"),"bad");return}if(start>localDateKey()){showToast(t("futureDate"),"bad");return}const challenge={id:uid("challenge"),title,category:document.getElementById("challengeCategoryInput").value,startDate:start,statuses:{},createdAt:new Date().toISOString()};state.challenges.unshift(challenge);activeChallengeId=challenge.id;closeSheet("challengeSheet");scheduleSave();renderChallenges();showToast(t("challengeAdded"),"good")}
function cycleChallengeDay(id,day){const c=state.challenges.find(x=>x.id===id),date=c?challengeDayDate(c,day):"";if(!c||date>localDateKey()){showToast(t("futureDisabled"));return}showDialog(`<h2>${t("challengeChoose")}</h2><p>${esc(c.title)} · ${day}. ${t("day")}</p><div class="stack"><button class="primary" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="done">✓ ${t("done")}</button><button class="secondary" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="partial">◐ ${t("partial")}</button><button class="danger" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="missed">× ${t("missed")}</button><button class="ghost" data-action="set-challenge-status" data-id="${c.id}" data-day="${day}" data-status="clear">${t("clearStatus")}</button></div>`)}
function setChallengeStatus(id,day,status){const c=state.challenges.find(x=>x.id===id),date=c?challengeDayDate(c,day):"";if(!c||date>localDateKey())return;const current=c.statuses[day]||null,next=status==="clear"?null:status,key=rewardKey("challenge",`${c.id}_${day}`,date),reward={xp:10,coins:4,energy:7,category:c.category};if(current==="done"&&next!=="done")revokeReward(key,{fallbackCompletion:true,date});if(next)c.statuses[day]=next;else delete c.statuses[day];if(next==="done"&&current!=="done"){applyReward(key,reward,{activity:`${c.title} · ${day}. ${t("day")}`});showToast(t("completedReward",reward),"good");celebrate(10)}else showToast(t("statusChanged"));closeDialog(true);checkAchievements();scheduleSave();renderAll()}
function askDeleteChallenge(id){const c=state.challenges.find(x=>x.id===id);if(!c)return;showDialog(`<h2>${t("deleteChallenge")}</h2><p>${esc(c.title)}</p><div class="dialog-actions"><button class="danger" data-action="delete-challenge" data-id="${c.id}">${t("yesDelete")}</button><button class="ghost" data-action="close-dialog">${t("cancel")}</button></div>`)}
function deleteChallenge(id){const c=state.challenges.find(x=>x.id===id);if(c){Object.entries(c.statuses).forEach(([day,status])=>{if(status==="done"){const date=challengeDayDate(c,Number(day));revokeReward(rewardKey("challenge",`${c.id}_${day}`,date),{fallbackCompletion:true,date})}})}state.challenges=state.challenges.filter(x=>x.id!==id);if(activeChallengeId===id)activeChallengeId=null;closeDialog();scheduleSave();renderAll();showToast(t("rewardRemoved"))}

function changeWater(delta){const date=localDateKey(),r=currentWater(),wasComplete=r.count>=r.goal;r.count=clamp(r.count+delta,0,40);const isComplete=r.count>=r.goal,key=rewardKey("water","daily",date),reward={xp:8,coins:3,energy:5,category:"health"};if(!wasComplete&&isComplete){r.rewarded=true;applyReward(key,reward,{activity:t("waterComplete")});showToast(t("completedReward",reward),"good");celebrate()}else if(wasComplete&&!isComplete){r.rewarded=false;revokeReward(key,{fallbackCompletion:true,date});showToast(t("undoDone"))}checkAchievements();scheduleSave();renderAll()}
function updateWaterGoal(value){const newGoal=clamp(Number(value)||8,1,20),r=currentWater();if(r.count>0){showToast(t("waterGoalLocked"));renderSettings();return}r.goal=newGoal;state.water.defaultGoal=newGoal;scheduleSave();renderAll();showToast(t("waterGoalHistory"),"good")}
function claimGift(){const today=localDateKey();if(state.dailyGiftDates.includes(today)){closeDialog();showToast(t("alreadyGift"));return}const cycle=state.dailyGiftDates.length%7,coins=[5,7,8,10,12,15,25][cycle],xp=[4,5,6,8,9,10,18][cycle];state.dailyGiftDates.push(today);state.progress.coins+=coins;state.progress.xp+=xp;state.progress.categoryEnergy[goalCategory()]+=3;state.activity.unshift({id:uid("gift"),date:today,text:`${t("dailyGift")} · +${coins} coin`});closeDialog();scheduleSave();renderAll();showToast(`+${xp} XP · +${coins} coin`,"good");playCoin();celebrate();checkAchievements()}
function openGift(){const claimed=state.dailyGiftDates.includes(localDateKey());showDialog(`<div style="text-align:center"><div class="feature-icon" style="margin:0 auto 11px;background:var(--gold-soft);color:#9b6514">${icon("gift",25)}</div><h2>${t("dailyGift")}</h2><p>${claimed?t("alreadyGift"):t("giftCopy")}</p><div class="dialog-actions one"><button class="${claimed?"ghost":"primary"}" data-action="${claimed?"close-dialog":"claim-gift"}">${claimed?t("close"):t("claim")}</button></div></div>`)}

function focusReward(minutes,category="mind"){return{xp:Math.max(8,Math.round(minutes*.6)),coins:Math.max(3,Math.round(minutes*.2)),energy:Math.max(6,Math.round(minutes*.7)),category:CATEGORIES[category]?category:"mind"}}
function openFocus(minutes=null,taskId=null,category="mind"){const f=state.focusTimer;if(f.running||f.startedAt){renderFocusDialog();return}if(taskId){startNewFocus(clamp(Number(minutes)||25,5,180),taskId,category);return}renderFocusSetup()}
function startNewFocus(minutes,taskId=null,category="mind"){minutes=clamp(Number(minutes)||25,5,180);const sec=minutes*60;state.focusTimer={durationSec:sec,remainingSec:sec,running:false,endAt:0,startedAt:0,taskId:taskId||null,category:CATEGORIES[category]?category:"mind"};scheduleSave();renderFocusDialog()}
function renderFocusSetup(){const preferred=clamp(Number(state.profile.dailyMinutes)||25,5,180),presets=[10,25,45,60];showDialog(`<div class="focus-setup"><div><h2>${t("customFocus")}</h2><p>${t("focusRangeHelp")}</p></div><div class="focus-presets">${presets.map(n=>`<button class="focus-preset ${n===preferred?"active":""}" data-action="focus-preset" data-minutes="${n}">${n} ${t("minutesShort")}</button>`).join("")}</div><div class="field"><label>${t("focusMinutesInput")}</label><input class="text-input" id="customFocusMinutes" type="number" inputmode="numeric" min="5" max="180" step="1" value="${preferred}"></div><button class="primary" data-action="start-custom-focus">${t("focusStartCustom")}</button></div>`)}
function startCustomFocus(){const input=document.getElementById("customFocusMinutes"),minutes=Number(input?.value);if(!Number.isFinite(minutes)||minutes<5||minutes>180){showToast(t("invalidFocusMinutes"),"bad");return}startNewFocus(Math.round(minutes),null,goalCategory())}
function startOrPauseFocus(){const f=state.focusTimer;if(f.running){f.remainingSec=Math.max(0,Math.ceil((f.endAt-Date.now())/1000));f.running=false;f.endAt=0;clearInterval(timerInterval)}else{if(f.remainingSec<=0)f.remainingSec=f.durationSec;f.running=true;if(!f.startedAt)f.startedAt=Date.now();f.endAt=Date.now()+f.remainingSec*1000;startTimerLoop()}persistNow();renderFocusDialog();renderFocusFloat()}
function startTimerLoop(){clearInterval(timerInterval);timerInterval=setInterval(()=>{const f=state.focusTimer;if(!f.running){clearInterval(timerInterval);return}f.remainingSec=Math.max(0,Math.ceil((f.endAt-Date.now())/1000));updateTimerDisplays();if(f.remainingSec<=0)completeFocus();else if(f.remainingSec%5===0)scheduleSave()},1000)}
function reconcileFocusTimer(allowComplete=true){const f=state.focusTimer;if(f.running){f.remainingSec=Math.max(0,Math.ceil((Number(f.endAt)-Date.now())/1000));if(f.remainingSec<=0){if(allowComplete)completeFocus();else{f.running=false;f.remainingSec=0}}else startTimerLoop()}}
function completeFocus(){const f=state.focusTimer,minutes=Math.round(f.durationSec/60),date=localDateKey(),sessionId=uid("focus"),task=f.taskId?state.tasks.find(x=>x.id===f.taskId):null,category=task?.category||f.category||"mind",reward=task?rewardForTask(task):focusReward(minutes,category);clearInterval(timerInterval);state.progress.focusMinutes+=minutes;state.tracking.focusSessions.unshift({id:sessionId,date,minutes,category,completedAt:new Date().toISOString()});if(task&&!task.completedDates.includes(date))task.completedDates.push(date);applyReward(task?rewardKey("task",task.id,date):rewardKey("focus",sessionId,date),reward,{activity:t("sessionComplete",{minutes})});state.focusTimer=defaultState().focusTimer;closeDialog(true);checkAchievements();persistNow();renderAll();showToast(t("completedReward",reward),"good");playLevel();celebrate(26)}
function backgroundFocus(){closeDialog(true);renderFocusFloat();showToast(t("background"))}
function askCancelFocus(){showDialog(`<h2>${t("confirmCancelSession")}</h2><p>${t("focusCopy")}</p><div class="dialog-actions"><button class="danger" data-action="confirm-cancel-focus">${t("cancelSession")}</button><button class="ghost" data-action="focus-back">${t("cancel")}</button></div>`)}
function cancelFocus(){clearInterval(timerInterval);state.focusTimer=defaultState().focusTimer;closeDialog(true);scheduleSave();renderFocusFloat();showToast(t("sessionCanceled"))}
function focusBack(){closeDialog(true);renderFocusDialog()}
function focusTimeText(){const sec=Math.max(0,Math.ceil(state.focusTimer.remainingSec||0)),m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function updateTimerDisplays(){const f=state.focusTimer,time=focusTimeText(),pct=100-(f.remainingSec/f.durationSec*100),timeEl=document.getElementById("timerValue"),ring=document.getElementById("timerRing");if(timeEl)timeEl.textContent=time;if(ring)ring.style.setProperty("--pct",`${clamp(pct,0,100)}%`);document.getElementById("focusFloatTime").textContent=time}
function renderFocusDialog(){const f=state.focusTimer,pct=100-(f.remainingSec/f.durationSec*100);showDialog(`<div class="timer"><h2>${t("focusTime")}</h2><p>${t("rewardFair")}</p><div class="timer-ring" id="timerRing" style="--pct:${clamp(pct,0,100)}%"><div><div class="timer-value" id="timerValue">${focusTimeText()}</div><div class="timer-label">${f.running?t("focusRunning"):f.startedAt?t("focusPaused"):t("focusReady")}</div></div></div><div class="timer-actions"><button class="primary" data-action="toggle-focus">${f.running?t("pause"):f.startedAt?t("resume"):t("start")}</button><button class="danger" data-action="cancel-focus">${t("cancelSession")}</button><button class="ghost background" data-action="background-focus">${t("background")}</button></div></div>`);document.getElementById("dialogBackdrop").dataset.focus="1"}

function applyTranslations(){document.documentElement.lang=state.settings.lang;document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));document.querySelectorAll("option[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));document.title=`Habitopia · ${t("progress")}`}

function renderStatic(){const brand=document.getElementById("brandIcon"),stage=document.getElementById("obBrandStage"),favicon=document.getElementById("appFavicon");if(brand)brand.innerHTML=`<img src="${BRAND_LOGO_DATA}" alt="Habitopia">`;if(stage)stage.style.backgroundImage=`url("${BRAND_LOGO_DATA}")`;if(favicon)favicon.href=BRAND_LOGO_DATA;document.getElementById("giftButton").innerHTML=icon("gift",20);document.getElementById("focusIcon").innerHTML=icon("timer",21);document.getElementById("addHabitIcon").innerHTML=icon("plus",20);document.getElementById("addChallengeIcon").innerHTML=icon("plus",20);document.getElementById("settingsIcon").innerHTML=icon("settings",20);document.getElementById("trackerWaterIcon").innerHTML=icon("water",19);document.getElementById("trackerWeightIcon").innerHTML=icon("weight",19);document.getElementById("trackerFocusIcon").innerHTML=icon("timer",19);document.getElementById("trackerNotesIcon").innerHTML=icon("note",19);if(document.getElementById("trackerReportIcon"))document.getElementById("trackerReportIcon").innerHTML=icon("stats",19);const navs={today:"today",habits:"habits",challenges:"challenge",profile:"stats"};document.querySelectorAll(".nav-btn").forEach(btn=>btn.innerHTML=`${icon(navs[btn.dataset.view],21)}<span>${t(btn.dataset.view==="profile"?"progress":btn.dataset.view)}</span>`);fillCategorySelects();fillWaterGoals()}

function fillCategorySelects(){const options=Object.keys(CATEGORIES).map(id=>`<option value="${id}">${categoryName(id)}</option>`).join("");["taskCategoryInput","habitCategoryInput","challengeCategoryInput"].forEach(id=>{const el=document.getElementById(id);if(el){const value=el.value;el.innerHTML=options;if(CATEGORIES[value])el.value=value}})}
function fillWaterGoals(){const options=Array.from({length:20},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");["waterGoalInput","obWaterGoal"].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML=options;el.value=state.water.defaultGoal}})}
function renderHeader(){const info=levelInfo(),hour=new Date().getHours(),hello=hour<6?t("helloNight"):hour<12?t("helloMorning"):hour<18?t("helloDay"):t("helloEvening"),name=state.profile.name||"Habitopia";document.getElementById("greeting").textContent=`${hello}, ${name}`;document.getElementById("dateLabel").textContent=new Date().toLocaleDateString(state.settings.lang==="en"?"en-US":"tr-TR",{weekday:"long",day:"numeric",month:"long"}).toLocaleUpperCase(state.settings.lang==="en"?"en-US":"tr-TR");const levelTitle=info.level>=30?t("levelPath30"):info.level>=20?t("levelPath20"):info.level>=10?t("levelPath10"):info.level>=5?t("levelPath5"):t("levelPath1");document.getElementById("levelLabel").innerHTML=`${t("level",{n:info.level})}<span class="level-title">· ${levelTitle}</span>`;document.getElementById("xpFill").style.width=`${info.pct}%`;document.getElementById("coinCount").textContent=fmt(state.progress.coins)}
function todayHabitProgress(){const today=localDateKey(),due=state.habits.filter(h=>habitDue(h,today));return{done:due.filter(h=>h.completedDates.includes(today)).length,total:due.length}}

function renderFocusStats(){const days=lastDays(7),sessions=state.tracking.focusSessions,weekSessions=sessions.filter(x=>days.some(d=>d.key===x.date)),values=days.map(d=>sessions.filter(x=>x.date===d.key).reduce((n,x)=>n+Number(x.minutes),0)),week=values.reduce((a,b)=>a+b,0),today=values[values.length-1]||0,max=Math.max(1,...values),count=weekSessions.length,total=sessions.reduce((n,x)=>n+Number(x.minutes),0),avg=sessions.length?Math.round(total/sessions.length):0,longest=sessions.length?Math.max(...sessions.map(x=>Number(x.minutes)||0)):0,history=sessions.slice(0,12);document.getElementById("focusStatsContent").innerHTML=`<div class="weight-hero" style="background:linear-gradient(145deg,#eee9f8,#faf8ff);border-color:#ded6ef"><div class="weight-top"><div><span>${t("thisWeek")}</span><strong style="color:var(--purple)">${fmt(week)} ${t("minutesShort")}</strong></div><span class="delta" style="background:#eee9f8;color:var(--purple)">${count} ${t("sessions")}</span></div><div class="bar-chart">${days.map((d,i)=>`<div class="bar-col"><em>${values[i]}</em><i style="--h:${Math.max(5,values[i]/max*92)}px;background:linear-gradient(#9a83bb,#745e9a)"></i><span>${t(DAY_KEYS[dayIndexMonday(d.key)])}</span></div>`).join("")}</div></div><div class="stat-grid"><div class="stat"><span>${t("todayFocus")}</span><strong>${fmt(today)} ${t("minutesShort")}</strong></div><div class="stat"><span>${t("totalFocus")}</span><strong>${fmt(total)} ${t("minutesShort")}</strong></div><div class="stat"><span>${t("averageSession")}</span><strong>${fmt(avg)} ${t("minutesShort")}</strong></div><div class="stat"><span>${t("longestSession")}</span><strong>${fmt(longest)} ${t("minutesShort")}</strong></div></div><div class="section-head"><h2>${t("focusHistory")}</h2><span>${sessions.length} ${t("sessions")}</span></div><div class="focus-history">${history.length?history.map(x=>`<div class="focus-history-item"><div class="feature-icon">${icon("timer",17)}</div><div class="focus-history-main"><strong>${formatDate(x.date)}</strong><span>${new Date(x.completedAt).toLocaleTimeString(state.settings.lang==="en"?"en-US":"tr-TR",{hour:"2-digit",minute:"2-digit"})} · ${categoryName(x.category)}</span></div><b>${x.minutes} ${t("minutesShort")}</b></div>`).join(""):`<div class="empty"><strong>${t("noRecord")}</strong></div>`}</div>`}

function openNotes(){resetNoteEditor();renderNotes();openSheet("notesSheet")}
function renderNoteColors(){document.getElementById("noteColors").innerHTML=NOTE_COLORS.map(color=>`<button class="note-color ${selectedNoteColor===color?"active":""}" style="--note:${color}" data-action="note-color" data-color="${color}"></button>`).join("")}
function resetNoteEditor(){document.getElementById("editingNoteId").value="";document.getElementById("noteTitleInput").value="";document.getElementById("noteBodyInput").value="";document.getElementById("noteSaveButton").textContent=t("save");selectedNoteColor=NOTE_COLORS[0];renderNoteColors()}
function saveNote(){const title=document.getElementById("noteTitleInput").value.trim(),body=document.getElementById("noteBodyInput").value.trim(),id=document.getElementById("editingNoteId").value;if(!title&&!body){showToast(t("emptyNote"),"bad");return}const now=new Date().toISOString();if(id){const n=state.tracking.notes.find(x=>x.id===id);if(n){n.title=(title||t("notebook")).slice(0,60);n.body=body.slice(0,3000);n.color=selectedNoteColor;n.updatedAt=now}}else state.tracking.notes.unshift({id:uid("note"),title:(title||t("notebook")).slice(0,60),body:body.slice(0,3000),color:selectedNoteColor,pinned:false,createdAt:now,updatedAt:now});scheduleSave();resetNoteEditor();renderNotes();renderProfile();checkAchievements();showToast(t(id?"noteUpdated":"noteSaved"),"good")}
function renderNotes(){renderNoteColors();const q=(document.getElementById("noteSearchInput").value||"").toLocaleLowerCase(state.settings.lang==="en"?"en-US":"tr-TR"),notes=state.tracking.notes.slice().sort((a,b)=>Number(b.pinned)-Number(a.pinned)||new Date(b.updatedAt)-new Date(a.updatedAt)).filter(n=>!q||`${n.title} ${n.body}`.toLocaleLowerCase().includes(q));document.getElementById("notesList").innerHTML=notes.length?notes.map(n=>`<article class="note" style="--note:${n.color}" data-action="open-note-detail" data-id="${n.id}"><div class="note-head"><strong>${n.pinned?"📌 ":""}${esc(n.title)}</strong><div class="note-actions"><button data-action="pin-note" data-id="${n.id}">${t(n.pinned?"unpin":"pin")}</button><button data-action="edit-note" data-id="${n.id}">${t("edit")}</button><button data-action="delete-note" data-id="${n.id}">${t("delete")}</button></div></div>${n.body?`<p class="note-preview">${esc(n.body)}</p>`:""}<span style="font-size:9px;color:var(--muted)">${new Date(n.updatedAt).toLocaleDateString(state.settings.lang==="en"?"en-US":"tr-TR")}</span></article>`).join(""):`<div class="empty"><strong>${t("noNotes")}</strong></div>`}
function openNoteDetail(id){const n=state.tracking.notes.find(x=>x.id===id);if(!n)return;document.getElementById("noteDetailContent").innerHTML=`<div class="note-detail-hero" style="border-left:6px solid ${n.color}"><h1 class="note-detail-title">${n.pinned?"📌 ":""}${esc(n.title)}</h1><div class="note-detail-meta">${new Date(n.updatedAt).toLocaleString(state.settings.lang==="en"?"en-US":"tr-TR",{dateStyle:"medium",timeStyle:"short"})}</div></div><div class="note-detail-body">${n.body?esc(n.body):"—"}</div><div class="note-detail-actions"><button class="ghost" data-action="pin-note-detail" data-id="${n.id}">${t(n.pinned?"unpin":"pin")}</button><button class="primary" data-action="edit-note-detail" data-id="${n.id}">${t("edit")}</button></div>`;openSheet("noteDetailSheet")}
function showWeightPoint(el,id){const r=state.tracking.weights.find(x=>x.id===id);if(!r)return;showPointTip(el,`${formatDate(r.date,true)} · ${decimal(r.value)} ${t("kg")}`)}
function showPointTip(anchor,text){const tip=document.getElementById("pointTip"),app=document.getElementById("app"),a=anchor.getBoundingClientRect(),b=app.getBoundingClientRect();tip.textContent=text;tip.style.left=`${clamp(a.left+a.width/2-b.left,54,b.width-54)}px`;tip.style.top=`${Math.max(70,a.top-b.top)}px`;tip.classList.add("show");clearTimeout(tip._timer);tip._timer=setTimeout(()=>tip.classList.remove("show"),2200)}
function pinNote(id){const n=state.tracking.notes.find(x=>x.id===id);if(!n)return;n.pinned=!n.pinned;n.updatedAt=new Date().toISOString();scheduleSave();renderNotes();renderProfile()}
function editNote(id){const n=state.tracking.notes.find(x=>x.id===id);if(!n)return;document.getElementById("editingNoteId").value=n.id;document.getElementById("noteTitleInput").value=n.title;document.getElementById("noteBodyInput").value=n.body;selectedNoteColor=n.color;document.getElementById("noteSaveButton").textContent=t("edit");renderNoteColors();document.getElementById("noteTitleInput").focus()}
function editNoteFromDetail(id){closeSheet("noteDetailSheet");editNote(id)}
function pinNoteFromDetail(id){pinNote(id);openNoteDetail(id)}
function deleteNote(id){state.tracking.notes=state.tracking.notes.filter(x=>x.id!==id);closeSheet("noteDetailSheet");scheduleSave();resetNoteEditor();renderNotes();renderProfile()}

function openSettings(){renderSettings();openSheet("settingsSheet")}
function renderSettings(){const r=currentWater();document.getElementById("nameInput").value=state.profile.name;document.getElementById("languageInput").value=state.settings.lang;fillWaterGoals();document.getElementById("waterGoalInput").value=r.count>0?r.goal:state.water.defaultGoal;document.getElementById("waterGoalInput").disabled=r.count>0;document.getElementById("waterGoalHelp").textContent=r.count?t("waterGoalLocked"):t("waterGoalHistory");const items=[{id:"sound",icon:"volume",name:"sound",copy:"soundCopy"},{id:"dark",icon:"moon",name:"dark",copy:"darkCopy"},{id:"reduceMotion",icon:"motion",name:"reduceMotion",copy:"reduceMotionCopy"}];document.getElementById("settingsList").innerHTML=items.map(x=>`<div class="setting"><div class="feature-icon" style="width:34px;height:34px">${icon(x.icon,17)}</div><div class="setting-copy"><strong>${t(x.name)}</strong><span>${t(x.copy)}</span></div><button class="switch ${state.settings[x.id]?"on":""}" data-action="toggle-setting" data-id="${x.id}"><i></i></button></div>`).join("")}
function changeLanguage(lang){state.settings.lang=lang==="en"?"en":"tr";applyTranslations();renderStatic();renderAll();renderSettings();scheduleSave();showToast(t("languageChanged"),"good")}
function toggleSetting(id){if(!["sound","dark","reduceMotion"].includes(id))return;state.settings[id]=!state.settings[id];applySettings();renderSettings()}
function updateName(value){state.profile.name=String(value).slice(0,28);scheduleSave();renderHeader()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`habitopia-v9-${localDateKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast(t("dataExported"),"good")}
function importData(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=="object")throw new Error();state=normalizeState(parsed);applySettings();applyTranslations();renderStatic();renderAll();document.getElementById("onboarding").classList.toggle("hidden",!!state.onboardingDone);closeSheet("settingsSheet");persistNow();showToast(t("dataImported"),"good")}catch(error){showToast(t("invalidBackup"),"bad")}};reader.readAsText(file);event.target.value=""}
function askReset(){showDialog(`<h2>${t("confirmReset")}</h2><p>${t("resetCopy")}</p><div class="dialog-actions"><button class="danger" data-action="confirm-reset">${t("reset")}</button><button class="ghost" data-action="close-dialog">${t("cancel")}</button></div>`)}
async function resetAll(){clearInterval(timerInterval);state=defaultState();await storageAdapter.remove(STORAGE_KEY);await storageAdapter.remove(BACKUP_KEY);await persistNow();closeDialog(true);closeSheet("settingsSheet");applySettings();applyTranslations();renderStatic();renderAll();document.getElementById("onboarding").classList.remove("hidden");showOnboarding(0)}

function onboardingSuggestions(){const en=state.settings.lang==="en",sets={focusGoal:en?["Focus for 25 minutes","Read for 10 minutes","Put the phone away for 30 minutes"]:["25 dakika odaklan","10 dakika kitap oku","Telefonu 30 dakika bırak"],healthGoal:en?["Walk for 20 minutes","Add vegetables to one meal","Reach 7,000 steps"]:["20 dakika yürü","Bir öğüne sebze ekle","7.000 adıma ulaş"],orderGoal:en?["Tidy the desk for 5 minutes","Write tomorrow's plan","Organize one drawer"]:["Masayı 5 dakika düzenle","Yarının planını yaz","Bir çekmeceyi düzenle"],balanceGoal:en?["Take 10 minutes for yourself","Go for a short walk","Write today's 3 priorities"]:["Kendine 10 dakika ayır","Kısa bir yürüyüş yap","Bugünün 3 önceliğini yaz"]};return sets[state.profile.goal]||sets.balanceGoal}
function renderOnboarding(){document.querySelectorAll("[data-ob-lang]").forEach(b=>b.classList.toggle("active",b.dataset.obLang===state.settings.lang));const name=document.getElementById("obName"),habit=document.getElementById("obHabit"),goalIcons={focusGoal:"timer",healthGoal:"water",orderGoal:"today",balanceGoal:"spark"};if(name&&document.activeElement!==name)name.value=state.profile.name;const obCurrent=document.getElementById("obCurrentWeight"),obTarget=document.getElementById("obTargetWeight");if(obCurrent&&document.activeElement!==obCurrent&&!obCurrent.value&&state.tracking.weights.length)obCurrent.value=state.tracking.weights[state.tracking.weights.length-1].value;if(obTarget&&document.activeElement!==obTarget&&!obTarget.value&&state.profile.targetWeight)obTarget.value=state.profile.targetWeight;document.getElementById("obGoals").innerHTML=GOAL_IDS.map(id=>`<button class="goal-card choice-animate ${state.profile.goal===id?"active":""}" data-action="ob-goal" data-id="${id}"><b>${icon(goalIcons[id],16)}</b><strong>${t(id)}</strong><span>${categoryName(id==="focusGoal"?"mind":id==="healthGoal"?"health":id==="orderGoal"?"order":"social")}</span></button>`).join("");document.getElementById("obTimes").innerHTML=TIME_OPTIONS.map(minutes=>`<button class="time-card choice-animate ${Number(state.profile.dailyMinutes)===minutes?"active":""}" data-action="ob-time" data-minutes="${minutes}"><b>${icon("timer",16)}</b><strong>${t(`time${minutes}`)}</strong><span>${t(`time${minutes}Copy`)}</span></button>`).join("");const suggestions=onboardingSuggestions();document.getElementById("obHabitSuggestions").innerHTML=suggestions.map(text=>`<button class="suggestion-chip" data-action="ob-suggestion" data-value="${esc(text)}">${esc(text)}</button>`).join("");if(habit&&!habit.value)habit.value=suggestions[0];fillWaterGoals();document.getElementById("obWaterGoal").value=state.water.defaultGoal;document.getElementById("obTimeSummary").textContent=t(`time${state.profile.dailyMinutes}`);document.getElementById("obGoalSummary").textContent=t(state.profile.goal);validateOnboarding()}
function showOnboarding(step){const next=Number(step);if(next>0)renderOnboarding();document.querySelectorAll(".ob-step").forEach(x=>x.classList.toggle("active",Number(x.dataset.ob)===next));document.querySelector(`.ob-step[data-ob="${next}"]`)?.scrollTo(0,0)}
function validateOnboarding(){const name=document.getElementById("obName")?.value.trim()||state.profile.name;const nameNext=document.getElementById("obNameNext"),goalNext=document.getElementById("obGoalNext"),timeNext=document.getElementById("obTimeNext");if(nameNext)nameNext.disabled=name.length<2;if(goalNext)goalNext.disabled=!GOAL_IDS.includes(state.profile.goal);if(timeNext)timeNext.disabled=!TIME_OPTIONS.includes(Number(state.profile.dailyMinutes))}
function selectOnboardingLanguage(lang){state.settings.lang=lang==="en"?"en":"tr";const habit=document.getElementById("obHabit");if(document.querySelector('.ob-step[data-ob="0"].active')&&habit)habit.value="";applyTranslations();renderStatic();renderOnboarding();applySettings()}
function selectGoal(id){if(!GOAL_IDS.includes(id))return;state.profile.goal=id;const habit=document.getElementById("obHabit");if(habit)habit.value="";renderOnboarding()}
function selectOnboardingTime(minutes){minutes=Number(minutes);if(!TIME_OPTIONS.includes(minutes))return;state.profile.dailyMinutes=minutes;renderOnboarding()}
function selectOnboardingSuggestion(text){const input=document.getElementById("obHabit");if(!input)return;input.value=String(text||"").slice(0,70);input.focus()}
function onboardingNext(step){const next=Number(step);if(next===2){const name=document.getElementById("obName").value.trim();if(name.length<2){showToast(t("nameRequired"),"bad");return}state.profile.name=name}if(next===3&&!GOAL_IDS.includes(state.profile.goal)){showToast(t("goalRequired"),"bad");return}if(next===4&&!TIME_OPTIONS.includes(Number(state.profile.dailyMinutes)))return;showOnboarding(next)}
async function finishOnboarding(){const title=document.getElementById("obHabit").value.trim(),currentWeight=Number(String(document.getElementById("obCurrentWeight")?.value||"").replace(",",".")),targetWeight=Number(String(document.getElementById("obTargetWeight")?.value||"").replace(",","."));if(!title){showToast(t("habitRequired"),"bad");showOnboarding(4);return}if(!Number.isFinite(currentWeight)||currentWeight<25||currentWeight>350){showToast(t("invalidWeight"),"bad");return}if(!Number.isFinite(targetWeight)||targetWeight<25||targetWeight>350){showToast(t("invalidTargetWeight"),"bad");return}state.profile.name=document.getElementById("obName").value.trim()||state.profile.name||"Habitopia";state.profile.targetWeight=Math.round(targetWeight*10)/10;const today=localDateKey();if(!state.tracking.weights.some(x=>x.date===today))state.tracking.weights.push({id:uid("weight"),date:today,value:Math.round(currentWeight*10)/10,createdAt:new Date().toISOString()});state.tracking.weights.sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));state.water.defaultGoal=clamp(Number(document.getElementById("obWaterGoal").value)||8,1,20);state.water.records[today]={count:0,goal:state.water.defaultGoal,rewarded:false};if(!state.habits.length)state.habits.push({id:uid("habit"),title,category:goalCategory(),activeDays:[0,1,2,3,4,5,6],completedDates:[],createdAt:new Date().toISOString()});if(!state.challenges.length)state.challenges.push({id:uid("challenge"),title:state.settings.lang==="en"?"My first 21-day challenge":"İlk 21 günlük challenge'ım",category:goalCategory(),startDate:today,statuses:{},createdAt:new Date().toISOString()});state.onboardingDone=true;state.activity.unshift({id:uid("start"),date:today,text:"Habitopia v8"});await persistNow();document.getElementById("onboarding").classList.add("hidden");renderAll();showToast(t("welcomeReady"),"good");celebrate(28)}

function showView(name){document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===`view-${name}`));document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x.dataset.view===name));document.getElementById("main").scrollTop=0;if(name==="habits")renderHabits();if(name==="challenges")renderChallenges();if(name==="profile")renderProfile()}
function openSheet(id){document.getElementById(id)?.classList.add("open")}
function closeSheet(id){document.getElementById(id)?.classList.remove("open")}
function showDialog(html){document.getElementById("dialogBody").innerHTML=html;document.getElementById("dialogBackdrop").classList.add("open")}
function closeDialog(force=false){const back=document.getElementById("dialogBackdrop");if(back.dataset.focus&&!force&&state.focusTimer.running){backgroundFocus();return}back.classList.remove("open");back.dataset.focus=""}
function showToast(message,type=""){const el=document.getElementById("toast");el.textContent=message;el.className=`toast show ${type}`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className="toast",3000)}
function celebrate(count=20){if(state.settings.reduceMotion)return;const host=document.getElementById("celebrate"),colors=["#e5a63d","#5f9469","#d16a5d","#5d87a0","#8d6d9d"];host.innerHTML="";for(let i=0;i<count;i++){const el=document.createElement("i");el.className="confetti";el.style.left=`${15+Math.random()*70}%`;el.style.background=colors[i%colors.length];el.style.setProperty("--x",`${(Math.random()-.5)*300}px`);el.style.animationDelay=`${Math.random()*.15}s`;host.appendChild(el)}setTimeout(()=>host.innerHTML="",1550)}
function playTone(freq,duration=.12,delay=0){if(!state.settings.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),start=audioContext.currentTime+delay;osc.frequency.value=freq;gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(.11,start+.01);gain.gain.exponentialRampToValueAtTime(.001,start+duration);osc.connect(gain).connect(audioContext.destination);osc.start(start);osc.stop(start+duration+.02)}catch(error){}}
function playSuccess(){playTone(620,.12);playTone(870,.15,.08)}function playCoin(){playTone(1030,.1);playTone(1320,.12,.06)}function playLevel(){playTone(520,.12);playTone(660,.12,.1);playTone(880,.22,.2)}
function renderAll(){currentWater();updateStreak();applyTranslations();renderHeader();renderToday();renderHabits();renderChallenges();checkAchievements();renderProfile();renderSettings();renderFocusFloat()}

function handleAction(action,el){const id=el.dataset.id,date=el.dataset.date,day=Number(el.dataset.day);switch(action){case"gift":openGift();break;case"claim-gift":claimGift();break;case"quick-task":addQuickTask();break;case"open-task":openTaskSheet();break;case"save-task":saveTask();break;case"effort":selectedEffort=id;renderTaskForm();break;case"toggle-task":toggleTask(id);break;case"ask-delete-task":askDeleteTask(id);break;case"delete-task":deleteTask(id);break;case"water-plus":changeWater(1);break;case"water-minus":changeWater(-1);break;case"open-focus":closeSheet("focusStatsSheet");openFocus();break;case"focus-preset":{const input=document.getElementById("customFocusMinutes");if(input)input.value=el.dataset.minutes;document.querySelectorAll(".focus-preset").forEach(b=>b.classList.toggle("active",b===el));break}case"start-custom-focus":startCustomFocus();break;case"reopen-focus":renderFocusDialog();break;case"toggle-focus":startOrPauseFocus();break;case"background-focus":backgroundFocus();break;case"cancel-focus":askCancelFocus();break;case"confirm-cancel-focus":cancelFocus();break;case"focus-back":focusBack();break;case"add-habit":openHabitSheet();break;case"habit-day-choice":el.classList.toggle("active");break;case"save-habit":saveHabit();break;case"toggle-habit":toggleHabit(id,date);break;case"ask-delete-habit":askDeleteHabit(id);break;case"delete-habit":deleteHabit(id);break;case"week-prev":weekOffset--;renderHabits();break;case"week-next":if(weekOffset<0)weekOffset++;renderHabits();break;case"add-challenge":openChallengeSheet();break;case"save-challenge":saveChallenge();break;case"challenge-day":cycleChallengeDay(id,day);break;case"set-challenge-status":setChallengeStatus(id,day,el.dataset.status);break;case"select-challenge":activeChallengeId=id;renderChallenges();break;case"challenge-help":showDialog(`<h2>${t("howItWorks")}</h2><p>${t("challengeHelp")}</p><div class="dialog-actions one"><button class="primary" data-action="close-dialog">${t("close")}</button></div>`);break;case"ask-delete-challenge":askDeleteChallenge(id);break;case"delete-challenge":deleteChallenge(id);break;case"water-stats":openWaterStats();break;case"weight":openWeight();break;case"save-weight":saveWeight();break;case"save-target-weight":saveTargetWeight();break;case"delete-weight":deleteWeight(id);break;case"weight-point":showWeightPoint(el,id);break;case"mood":openMood();break;case"save-mood":saveMood(el.dataset.value);break;case"weekly-report":openWeeklyReport();break;case"focus-stats":openFocusStats();break;case"notes":openNotes();break;case"open-note-detail":openNoteDetail(id);break;case"note-color":selectedNoteColor=el.dataset.color;renderNoteColors();break;case"save-note":saveNote();break;case"pin-note":pinNote(id);break;case"pin-note-detail":pinNoteFromDetail(id);break;case"edit-note":editNote(id);break;case"edit-note-detail":editNoteFromDetail(id);break;case"delete-note":deleteNote(id);break;case"settings":openSettings();break;case"toggle-setting":toggleSetting(id);break;case"export":exportData();break;case"import":document.getElementById("importFile").click();break;case"reset":askReset();break;case"confirm-reset":resetAll();break;case"close-dialog":closeDialog(true);break;case"ob-next":onboardingNext(Number(el.dataset.step));break;case"ob-back":showOnboarding(Number(el.dataset.step));break;case"ob-goal":selectGoal(id);break;case"ob-time":selectOnboardingTime(el.dataset.minutes);break;case"ob-suggestion":selectOnboardingSuggestion(el.dataset.value);break;case"finish-onboarding":finishOnboarding();break}}
function bindEvents(){document.addEventListener("click",event=>{const close=event.target.closest("[data-close]");if(close){closeSheet(close.dataset.close);return}const lang=event.target.closest("[data-ob-lang]");if(lang){selectOnboardingLanguage(lang.dataset.obLang);return}const nav=event.target.closest(".nav-btn");if(nav){showView(nav.dataset.view);return}const action=event.target.closest("[data-action]");if(action)handleAction(action.dataset.action,action)});document.querySelectorAll(".sheet-backdrop").forEach(back=>back.addEventListener("click",event=>{if(event.target===back)closeSheet(back.id)}));document.getElementById("dialogBackdrop").addEventListener("click",event=>{if(event.target===event.currentTarget&&!state.focusTimer.running)closeDialog(true)});document.getElementById("taskTypeInput").addEventListener("change",renderTaskForm);document.getElementById("quickTask").addEventListener("keydown",event=>{if(event.key==="Enter")addQuickTask()});document.getElementById("noteSearchInput").addEventListener("input",renderNotes);document.getElementById("nameInput").addEventListener("input",event=>updateName(event.target.value));document.getElementById("languageInput").addEventListener("change",event=>changeLanguage(event.target.value));document.getElementById("waterGoalInput").addEventListener("change",event=>updateWaterGoal(event.target.value));document.getElementById("importFile").addEventListener("change",importData);document.getElementById("obName").addEventListener("input",validateOnboarding);document.addEventListener("visibilitychange",()=>{if(!document.hidden){reconcileFocusTimer(true);currentWater();renderAll()}else persistNow()});window.addEventListener("beforeunload",()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){}})}

async function init(){state=defaultState();bindEvents();await loadState();applyTranslations();renderStatic();renderOnboarding();reconcileFocusTimer(true);renderAll();document.getElementById("onboarding").classList.toggle("hidden",!!state.onboardingDone)}
init();
</script>
