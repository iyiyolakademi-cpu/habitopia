<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 700" role="img" aria-label="Gece gökyüzünde, ağacı ve ışıklı evleri olan Habitopia adası">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0B1830"/><stop offset=".58" stop-color="#19283D"/><stop offset="1" stop-color="#07232E"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#0E485D"/><stop offset=".6" stop-color="#092E45"/><stop offset="1" stop-color="#071723"/></linearGradient>
  <radialGradient id="dusk"><stop stop-color="#ffc88f" stop-opacity=".75"/><stop offset=".38" stop-color="#ffae84" stop-opacity=".16"/><stop offset="1" stop-color="#ffb78b" stop-opacity="0"/></radialGradient>
  <linearGradient id="land" x2="0" y2="1"><stop stop-color="#597448"/><stop offset="1" stop-color="#1E463B"/></linearGradient>
  <linearGradient id="cliff" x2=".25" y2="1"><stop stop-color="#476072"/><stop offset=".42" stop-color="#263F4D"/><stop offset=".83" stop-color="#132D3A"/><stop offset="1" stop-color="#0C202D"/></linearGradient>
  <linearGradient id="falls" x2="1" y2="0"><stop stop-color="#8BD5CB" stop-opacity=".3"/><stop offset=".25" stop-color="#BAEAE5"/><stop offset=".75" stop-color="#4BA8C3"/><stop offset="1" stop-color="#277D91" stop-opacity=".25"/></linearGradient>
  <linearGradient id="trunk" x2="1" y2=".2"><stop stop-color="#3C3026"/><stop offset=".5" stop-color="#89633E"/><stop offset="1" stop-color="#38271F"/></linearGradient>
  <radialGradient id="leaf"><stop stop-color="#63885A"/><stop offset=".7" stop-color="#2F604B"/><stop offset="1" stop-color="#194439"/></radialGradient>
  <radialGradient id="lantern"><stop stop-color="#FFD995" stop-opacity=".85"/><stop offset="1" stop-color="#FFD995" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
