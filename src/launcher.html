<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Habitopia: Hayat Borsası veya Habitopia Dünyası. Dünyanı seç.">
  <title>Habitopia — Dünyanı Seç</title>
  <link rel="icon" href="assets/habitopia-logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      --black: #000000;
      --white: #f9f9f7;
      --muted: #a7abaa;
      --cream: #f2dfbc;
      --cream-text: #19261f;
      --green: #214d42;
      --green-border: #477264;
      --green-text: #f0f7f3;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--black); }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--black);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .portal {
      width: min(100%, 540px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 23px max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .brand {
      display: block;
      width: clamp(218px, 68vw, 298px);
      height: clamp(218px, 68vw, 298px);
      flex-shrink: 0;
      margin: 0 auto 2px;
      overflow: hidden;
      background: #000;
    }
    .brand img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
    }
    .intro { text-align: center; max-width: 440px; margin: 0 0 31px; }
    .intro h1 {
      font-size: clamp(29px, 7.9vw, 45px);
      font-weight: 830;
      line-height: 1.12;
      letter-spacing: -0.055em;
      margin: 0 0 10px;
    }
    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      letter-spacing: -.012em;
    }
    .world-grid {
      display: grid;
      width: 100%;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .world {
      width: 100%;
      min-height: 88px;
      border-radius: 22px;
      padding: 15px 21px;
      border: 1.5px solid transparent;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 13px;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease, filter .16s ease, border-color .16s ease;
    }
    .world:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .world:active { transform: scale(.987); }
    .world:focus-visible { outline: 3px solid #f4f5f1; outline-offset: 4px; }
    .world.market {
      background: var(--cream);
      color: var(--cream-text);
      box-shadow: 0 8px 22px rgba(242, 223, 188, .09);
    }
    .world.habit {
      background: var(--green);
      border-color: var(--green-border);
      color: var(--green-text);
      box-shadow: 0 8px 22px rgba(33, 77, 66, .17);
    }
    .world-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .market .world-icon { background: #204b3e; color: #fbf5e7; }
    .habit .world-icon { background: #397261; color: #f4faf5; }
    .world-icon svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .world strong {
      display: block;
      font-size: clamp(16px, 4.8vw, 19px);
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -.04em;
      text-align: center;
    }
    .world-arrow { font-size: 29px; line-height: 1; text-align: right; font-weight: 350; }
    @media (max-height: 720px) {
      .portal { justify-content: flex-start; padding-top: max(12px, env(safe-area-inset-top)); }
      .brand { width: clamp(174px, 51vw, 228px); height: clamp(174px, 51vw, 228px); }
      .intro { margin-bottom: 19px; }
      .world { min-height: 76px; }
    }
    @media (max-width: 360px) {
      .portal { padding-left: 13px; padding-right: 13px; }
      .world { grid-template-columns: 46px minmax(0, 1fr) 19px; padding: 12px 13px; gap: 7px; border-radius: 18px; }
      .world-icon { width: 46px; height: 46px; }
      .world-icon svg { width: 22px; height: 22px; }
      .world strong { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .world { transition: none; }
    }
  </style>
</head>
<body>
  <main class="portal">
    <div class="brand">
      <img src="assets/habitopia-logo.jpg" alt="Habitopia" width="298" height="298" decoding="async">
    </div>
    <div class="intro">
      <h1>Dünyanı Seç</h1>
      <p>Devam etmek istediğin dünyaya dokun.</p>
    </div>
    <nav class="world-grid" aria-label="Habitopia dünya seçimi">
      <a class="world market" href="hayat-borsan.html" aria-label="Hayat Borsası'na geç">
        <span class="world-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 20h18M5 17l5-5 4 2 5-8"/><path d="M15 6h4v4"/></svg>
        </span>
        <strong>Hayat Borsası</strong>
        <span class="world-arrow" aria-hidden="true">›</span>
      </a>
      <a class="world habit" href="habitopia.html" aria-label="Habitopia Dünyası'na geç">
        <span class="world-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 21v-9M12 16C6 16 4 12 4 7c5 0 8 2 8 7M12 13c0-5 3-7 8-7 0 5-2 9-8 9"/></svg>
        </span>
        <strong>Habitopia Dünyası</strong>
        <span class="world-arrow" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
</body>
</html>
